function migrate(d){
  if(d.immeuble&&!(d.immeubles&&d.immeubles.length)){
    if(d.immeuble.nom||(d.logements||[]).length){
      d.immeubles=[{id:'i1',nom:d.immeuble.nom||'Mon immeuble',adresse:d.immeuble.adresse||'',proprietaire:d.immeuble.proprietaire||'',contact:d.immeuble.contact||''}];
      (d.logements||[]).forEach(l=>l.immeubleId=l.immeubleId||'i1');
      (d.depenses||[]).forEach(x=>x.immeubleId=x.immeubleId||'i1');
    }
  }
  delete d.immeuble;
  (d.settings?.users||[]).forEach((u,k,arr)=>{if(!u.login){let b=normLogin((u.nom||'user').split(/\s+/)[0])||'user',l=b,n=2;while(arr.some(x=>x!==u&&x.login===l))l=b+(n++);u.login=l;}});
  if(!d._demo&&(d.immeubles||[]).some(i=>i.id==='i1'&&i.nom==='Résidence Les Palmiers')&&(d.locataires||[]).some(t=>t.id==='t1'&&t.nom==='Kouamé Aya'))d._demo=true;
  (d.logements||[]).forEach(l=>{if(OLD_TYPES[l.type])l.type=OLD_TYPES[l.type];});
  const e=emptyDb();
  return {...e,...d,settings:{...e.settings,...(d.settings||{})}};
}
function load(){
  if(CLOUD)return emptyDb();
  let emb=null,loc=null;
  try{const t=document.getElementById('data').textContent.trim();if(t&&t!=='{}')emb=JSON.parse(t);}catch(e){}
  try{loc=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  const best=[emb,loc].filter(Boolean).sort((a,b)=>(b._ts||0)-(a._ts||0))[0];
  return best?migrate(best):emptyDb();
}

const imm=id=>db.immeubles.find(x=>x.id===id);
const logement=id=>db.logements.find(x=>x.id===id);
const locataire=id=>db.locataires.find(x=>x.id===id);
const bailNom=b=>locataire(b?.locataireId)?.nom||'—';
const logNom=id=>logement(id)?.nom||'—';
const bailLogement=lid=>db.baux.find(b=>b.logementId===lid&&!b.fin);
const bailActif=(b,ym)=>b.debut.slice(0,7)<=ym&&(!b.fin||b.fin.slice(0,7)>=ym);
const inImm=lid=>state.imm==='all'||logement(lid)?.immeubleId===state.imm;
const LOGS=()=>db.logements.filter(l=>state.imm==='all'||l.immeubleId===state.imm);
const BAUX=()=>db.baux.filter(b=>inImm(b.logementId));
const DEPS=()=>db.depenses.filter(d=>d.statut!=='refusee'&&(state.imm==='all'||d.immeubleId===state.imm));
const INCS=()=>db.incidents.filter(i=>inImm(i.logementId));
const PAYS=()=>{const ids=new Set(BAUX().map(b=>b.id));return db.paiements.filter(p=>ids.has(p.bailId));};
function montantDu(b,ym){let l=b.loyer,c=b.charges||0;(b.revisions||[]).forEach(r=>{if(!ym||r.depuis<=ym){l=r.loyer;c=r.charges;}});return Number(l)+Number(c||0);}
function idx(){if(PIDX)return PIDX;PIDX=new Map();for(const p of db.paiements){const k=p.bailId+'|'+p.mois;PIDX.set(k,(PIDX.get(k)||0)+p.montant);}return PIDX;}
const payeBail=(id,ym)=>idx().get(id+'|'+ym)||0;
const echu=(b,ym)=>{const cur=moisLoyer();return ym<cur||(ym===cur&&new Date().getDate()>Number(b.jour||5));};
/* Accords de paiement : le locataire paie une partie et promet le reste pour une date */
const accordDate=(b,ym)=>(b.accords||{})[ym]||'';
const accordActif=(b,ym)=>{const d=accordDate(b,ym);return !!d&&(today()<=d||!echu(b,ym))&&payeBail(b.id,ym)<montantDu(b,ym);};
function statutBail(b,ym){
  const du=montantDu(b,ym),p=payeBail(b.id,ym),reste=Math.max(0,du-p),acc=accordDate(b,ym);
  let statut=reste===0?'paye':p>0?'partiel':echu(b,ym)?'retard':'attente';
  if(reste>0&&acc)statut=today()<=acc||!echu(b,ym)?'accord':'retard';
  return {du,p,reste,statut,accord:acc};
}
const statutBadge=s=>s.statut==='accord'?`<span class="badge warn">⏳ Reste promis le ${fmtDate(s.accord)}</span>`:(s.statut==='retard'&&s.accord?`<span class="badge neg">Promesse non tenue (${fmtDate(s.accord)})</span>`:badge(s.statut));
function accords(B){
  const out=[];
  B.forEach(b=>Object.entries(b.accords||{}).forEach(([m,d])=>{const r=Math.max(0,montantDu(b,m)-payeBail(b.id,m));if(r>0)out.push({b,m,d,r,ok:today()<=d||!echu(b,m)});}));
  return out.sort((x,y)=>x.d.localeCompare(y.d));
}
function moisImpayes(b){
  const cur=moisLoyer(),end=b.fin&&b.fin.slice(0,7)<cur?b.fin.slice(0,7):cur,out=[];
  for(let m=b.debut.slice(0,7);m<=end;m=shift(m,1)){
    if(echu(b,m)&&!accordActif(b,m)){const r=Math.max(0,montantDu(b,m)-payeBail(b.id,m));if(r>0)out.push({m,r});}
  }
  return out;
}
function arrieres(b){const l=moisImpayes(b);return {tot:sum(l,x=>x.r),n:l.length,list:l};}
const attenduMois=ym=>sum(BAUX().filter(b=>bailActif(b,ym)),b=>montantDu(b,ym));
const encaisseMois=ym=>sum(PAYS().filter(p=>p.mois===ym),p=>p.montant);
const impayeMois=ym=>sum(BAUX().filter(b=>bailActif(b,ym)&&echu(b,ym)&&!accordActif(b,ym)),b=>statutBail(b,ym).reste);
const depMois=ym=>sum(DEPS().filter(d=>d.date.slice(0,7)===ym),d=>d.montant);
function nextNum(){db.settings.seq=(db.settings.seq||0)+1;return `${today().slice(0,4)}-${String(db.settings.seq).padStart(4,'0')}`;}

function chart12(ymEnd){
  const ms=[...Array(12)].map((_,i)=>shift(ymEnd,i-11));
  const d=ms.map(m=>({m,a:attenduMois(m),e:encaisseMois(m)}));
  CHART=d;
  const max=niceMax(Math.max(1,...d.map(x=>Math.max(x.a,x.e))));
  const W=720,H=230,pl=50,pr=6,pt=10,pb=24,ih=H-pt-pb,cw=(W-pl-pr)/12,bw=Math.max(4,Math.min(16,(cw-12)/2));
  const Y=v=>pt+ih*(1-v/max);
  const bar=(x,v,c)=>{const h=ih*v/max;if(h<0.5)return '';const r=Math.min(4,h,bw/2),yt=pt+ih-h,yb=pt+ih;return `<path d="M${x},${yb}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+bw-r}Q${x+bw},${yt} ${x+bw},${yt+r}V${yb}Z" fill="${c}"/>`;};
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${k?'#eef0f2':'#d1d5db'}"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${compact(v)}</text>`;}
  d.forEach((x,i)=>{
    const cx=pl+i*cw,x0=cx+(cw-(2*bw+2))/2;
    g+=`<rect class="hit" data-i="${i}" x="${cx}" y="${pt}" width="${cw}" height="${ih}" fill="transparent"/>`;
    g+=bar(x0,x.a,C_ATT)+bar(x0+bw+2,x.e,C_ENC);
    g+=`<text x="${cx+cw/2}" y="${H-6}" text-anchor="middle" class="ax">${MOIS_C[+x.m.slice(5)-1]}</text>`;
  });
  return `<div class="legend"><span><i style="background:${C_ATT}"></i>Attendu</span><span><i style="background:${C_ENC}"></i>Encaissé</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Loyers attendus et encaissés sur 12 mois">${g}</svg>
  <p class="muted small">Touchez ou survolez un mois pour le détail. Tableau complet dans Rapports.</p>`;
}
let tipOn=null;
function chartTip(e){
  const h=e.target.closest&&e.target.closest('.hit'),tip=document.getElementById('ctip');
  if(tipOn&&tipOn!==h){tipOn.classList.remove('on');tipOn=null;}
  if(!h){tip.classList.add('hidden');return;}
  const x=CHART[+h.dataset.i];if(!x)return;
  h.classList.add('on');tipOn=h;
  tip.innerHTML=`<b>${moisLabel(x.m)}</b><br><i style="background:${C_ATT}"></i>Attendu : ${fcfa(x.a)}<br><i style="background:${C_ENC}"></i>Encaissé : ${fcfa(x.e)}<br>Taux : ${x.a?Math.round(Math.min(x.e,x.a)/x.a*100):0} %`;
  tip.classList.remove('hidden');
  const r=h.getBoundingClientRect();
  tip.style.left=Math.min(window.innerWidth-200,Math.max(8,r.left+r.width/2-95))+'px';
  tip.style.top=Math.max(60,r.top-tip.offsetHeight-6)+'px';
}

function modal(title,body,onOk,okLabel='Enregistrer'){
  document.getElementById('mTitle').textContent=title;

  f.innerHTML=body+(onOk?`<div class="actions"><button type="button" class="ghost" data-a="closeModal">Annuler</button><button class="primary">${okLabel}</button></div>`:'');

}

  if(!db.logements.length)return `<div class="card hero"><div style="display:flex;align-items:center;gap:14px"><img src="${MARK}" width="64" height="64" alt="" style="border-radius:15px;box-shadow:0 0 0 2px rgba(255,255,255,.35)"><h2 style="margin:0">Bienvenue sur Gest<span class="gold">Immo</span> 👋</h2></div><p>Ajoutez votre immeuble et ses logements, puis enregistrez locataires, entrées, loyers, dépenses et incidents. Tout se calcule automatiquement.</p><div class="btns"><button data-a="addImmeuble">Ajouter un immeuble</button>${CLOUD?'':'<button class="ghost" data-a="demo">🎭 Voir une démo d’abord</button>'}${comptes()?'':'<button class="ghost" data-a="creerAdmin">🔐 Créer mon compte</button>'}</div></div>`;

  }
  if(arrTot>0)al.push(['neg','⚠️',`${fcfa(arrTot)} d’arriérés cumulés chez ${arr.length} locataire(s)`]);

    .forEach(({b,j})=>al.push(['warn','⏳',`Bail de ${bailNom(b)} (${logNom(b.logementId)}) : ${j<0?'échu depuis '+(-j)+' jour(s)':'se termine dans '+j+' jour(s)'} — ${fmtDate(b.finPrevue)}`]));
  const inc=INCS().filter(i=>i.statut!=='Résolu'),urg=inc.filter(i=>i.priorite==='Urgente').length;
  if(inc.length)al.push([urg?'neg':'warn','🛠️',`${inc.length} incident(s) en cours${urg?` dont ${urg} urgent(s)`:''}`]);
  const acc=accords(B),accOk=acc.filter(x=>x.ok),accKo=acc.filter(x=>!x.ok);

    ${kpi('Solde net',fcfa(solde),'Encaissé − dépenses',solde>=0?'ok':'neg')}

const PAGES={dash:pageDash,immeubles:pageImmeubles,locataires:pageLocataires,fiche:pageFiche,loyers:pageLoyers,depenses:pageDepenses,incidents:pageIncidents,rapports:pageRapports,parametres:pageParametres,relances:pageRelances,caisse:pageCaisse,journal:()=>CLOUD?pageJournalCloud():pageJournal(),plateforme:pagePlateforme};
function render(){
  PIDX=null;
  if(state.moisAuto)state.mois=moisLoyer();
  if(comptes()&&!isAdmin()&&state.page==='journal')state.page='dash';
  document.querySelectorAll('nav [data-id=journal]').forEach(b=>b.classList.toggle('hidden',!comptes()||!isAdmin()));
  document.querySelectorAll('nav [data-id=caisse]').forEach(b=>b.classList.toggle('hidden',!comptes()));
  document.querySelectorAll('nav [data-id=plateforme]').forEach(b=>b.classList.toggle('hidden',!(CLOUD&&PROFILE?.role==='plateforme')));
  if(state.page==='plateforme'&&!(CLOUD&&PROFILE?.role==='plateforme'))state.page='dash';
  const w=document.getElementById('who'),u=me();
  if(w){w.classList.toggle('hidden',!(comptes()&&u&&connecte()));if(u)w.innerHTML=`${u.role==='admin'?'👑':'👤'} ${esc(u.nom)} <small>${ROLE[u.role]}</small>`;}
  const lb=document.getElementById('lockBtn');if(lb)lb.textContent=comptes()?'⏻ Se déconnecter':'🔒';
  if(state.imm!=='all'&&!imm(state.imm))state.imm='all';
  const s=document.getElementById('immSel');
  s.innerHTML=`<option value="all">Tous les immeubles</option>`+db.immeubles.map(i=>`<option value="${i.id}" ${i.id===state.imm?'selected':''}>${esc(i.nom)}</option>`).join('');
  s.classList.toggle('hidden',db.immeubles.length<2);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===(state.page==='fiche'?'locataires':state.page)));
  const nr=db.logements.length?aRelancer().filter(r=>r.type!=='avant').length:0,nb=document.querySelector('nav [data-id=relances]');
  if(nb)nb.innerHTML=`📣 Relances${nr?` <span class="nb">${nr}</span>`:''}`;
  const br=document.querySelector('.brand');if(br)br.innerHTML=AG().logo?`<img src="${AG().logo}" class="brand-logo" alt=""><span>${esc(AG().nom||'GestImmo')}</span>`:`<img src="${MARK}" class="brand-mark" alt=""> <span>${AG().nom?esc(AG().nom):'Gest<span class="gold">Immo</span>'}</span>`;
  document.getElementById('ctip').classList.add('hidden');
  document.getElementById('app').innerHTML=connecte()&&!compromis()?(CLOUD&&SUP?`<div class="demo-bar sup-bar"><span>👁️ <b>Mode supervision</b> — agence <b>${esc(SUP.nom)}</b> : vous voyez et modifiez ses données. Toutes vos actions sont enregistrées dans son journal.</span><button class="primary sm" data-a="finSupervision">Quitter la supervision</button></div>`:'')+(db._demo?`<div class="demo-bar"><span>🎭 <b>Mode démo</b> — données fictives pour découvrir l’application.</span><button class="primary sm" data-a="quitterDemo">Quitter la démo → mon compte réel</button></div>`:'')+(PAGES[state.page]||pageDash)():'';
  stripAdmin(document.getElementById('app'));
  checkLock();
}
function checkLock(){
  document.getElementById('lockBtn').classList.toggle('hidden',!(comptes()||db.settings.pin));
  const L=document.getElementById('lock');
  const need=compromis()||(comptes()?!connecte():(!!db.settings.pin&&!state.unlocked));
  if(need){if(L.classList.contains('hidden'))renderLock();L.classList.remove('hidden');setTimeout(()=>document.getElementById('pinIn')?.focus(),50);}
  else L.classList.add('hidden');
}

const A={};
A.goto=id=>{state.page=id;render();window.scrollTo(0,0);};
A.fiche=id=>{state.page='fiche';state.id=id;render();window.scrollTo(0,0);};
A.mois=n=>{state.mois=shift(state.mois,Number(n));state.moisAuto=state.mois===moisLoyer();render();};
A.annee=n=>{state.annee=String(Number(state.annee)+Number(n));render();};
A.incF=v=>{state.incF=v;render();};

const immData=d=>{if(!d.nom.trim())fail('Le nom de l’immeuble est requis');return {nom:d.nom.trim(),adresse:d.adresse.trim(),proprietaire:d.proprietaire.trim(),contact:d.contact.trim()};};
A.addImmeuble=()=>modal('Nouvel immeuble',fImm(),d=>{const id=uid();db.immeubles.push({id,...immData(d)});if(db.immeubles.length>1)state.imm=id;state.page='immeubles';});
A.editImmeuble=id=>{const i=imm(id);modal('Modifier l’immeuble',fImm(i),d=>{Object.assign(i,immData(d));});};
A.delImmeuble=async id=>{
  if(db.logements.some(l=>l.immeubleId===id))return toast('Supprimez d’abord les logements de cet immeuble.');
  if(!await ask(`Supprimer l’immeuble ${imm(id).nom} ?`))return;
  log('logement','Suppression de l’immeuble '+(imm(id)?.nom||''));db.immeubles=db.immeubles.filter(x=>x.id!==id);save();render();
};

const logData=(d,id)=>{
  if(!d.immeubleId)fail('Choisissez un immeuble');
  if(!d.nom.trim())fail('Le nom du logement est requis');
  if(!(Number(d.loyer)>0))fail('Le loyer doit être supérieur à 0');
  return {id,immeubleId:d.immeubleId,nom:d.nom.trim(),type:d.type,etage:(d.etage||'').trim()||'RDC',loyer:Number(d.loyer),charges:Number(d.charges)||0};
};
A.addLogement=()=>{if(!db.immeubles.length){toast('Ajoutez d’abord un immeuble.');return A.addImmeuble();}modal('Nouveau logement',fLog(),d=>{const x=logData(d,uid());db.logements.push(x);log('logement',`Ajout ${x.nom} (${x.type}) — loyer ${fcfa(x.loyer+x.charges)}`,x.loyer+x.charges,x.id);});};
A.editLogement=id=>{const l=logement(id);modal('Modifier le logement',fLog(l),d=>{const av=l.loyer+(l.charges||0);Object.assign(l,logData(d,id));log('logement',`Modification ${l.nom}${av!==l.loyer+l.charges?` — loyer ${fcfa(av)} → ${fcfa(l.loyer+l.charges)}`:''}`,l.loyer+l.charges,l.id);});};
A.delLogement=async id=>{
  const l=logement(id);
  if(bailLogement(id))return toast('Ce logement est occupé : enregistrez d’abord la sortie.');
  if(db.baux.some(b=>b.logementId===id))return toast('Ce logement a un historique de baux : il ne peut pas être supprimé.');
  if(!await ask(`Supprimer le logement ${l.nom} ?`))return;
  log('logement','Suppression du logement '+l.nom);db.logements=db.logements.filter(x=>x.id!==id);save();render();
};

A.louer=lid=>{
  const l=logement(lid);
  if(bailLogement(lid))return toast('Ce logement est déjà occupé.');
  const libres=db.locataires.filter(t=>!db.baux.some(b=>!b.fin&&b.locataireId===t.id));
  modal(`Louer ${l.nom}`,
    `<p class="muted">Loyer prévu : <b>${fcfa(l.loyer)}</b>${l.charges?` + ${fcfa(l.charges)} de charges`:''}</p>`+
    sel('Locataire','locId',[['','— Nouveau locataire —'],...libres.map(t=>[t.id,t.nom])],'')+
    fld('Nom du nouveau locataire','nomNew','','text',false)+
    fld('Téléphone du nouveau locataire','telNew','','tel',false)+
    fld('Date d’entrée','debut',today(),'date')+
    fld('Fin prévue du bail (facultatif)','finPrevue',plusUnAn(today()),'date',false)+
    num('Loyer mensuel (FCFA)','loyer',l.loyer)+
    num('Charges (FCFA)','charges',l.charges||0,false)+
    num('Caution / dépôt de garantie (FCFA)','caution',l.loyer*2,false)+
    num('Avance versée à l’entrée (nombre de mois de loyer)','avance',0,false)+
    sel('Mode de paiement de l’avance','modeAv',MODES,'Espèces')+
    num('Jour d’échéance du loyer (1 à 31)','jour',5),
    d=>{
      if(!d.debut)fail('La date d’entrée est requise');
      if(!(Number(d.loyer)>0))fail('Loyer invalide');
      const jour=Number(d.jour);
      if(!(jour>=1&&jour<=31))fail('Le jour d’échéance doit être entre 1 et 31');
      if(d.finPrevue&&d.finPrevue<=d.debut)fail('La fin prévue doit être après l’entrée');
      const av=Math.min(24,Math.max(0,Math.floor(Number(d.avance)||0)));
      let locId=d.locId;
      if(!locId&&!d.nomNew.trim())fail('Indiquez le nom du locataire');
      if(!locId){locId=uid();db.locataires.push({id:locId,nom:d.nomNew.trim(),tel:d.telNew.trim(),email:'',profession:'',piece:'',urgence:'',notes:''});}
      const b={id:uid(),logementId:lid,locataireId:locId,debut:d.debut,fin:null,finPrevue:d.finPrevue||'',loyer:Number(d.loyer),charges:Number(d.charges)||0,caution:Number(d.caution)||0,jour,revisions:[],cautionRetenue:0,cautionRestituee:0,motifRetenue:''};
      if(!isAdmin()){b.loyer=Number(l.loyer);b.charges=Number(l.charges)||0;}
      db.baux.push(b);
      if(comptes()){b.cautionPar=state.uid;log('entree',`${bailNom(b)} entre dans ${logNom(b.logementId)} — loyer ${fcfa(montantDu(b))} — caution ${fcfa(b.caution)}`,b.caution,b.id);}
      if(av>0){const pl=planPaiement(b,montantJusqua(b,shift(d.debut.slice(0,7),av-1)));if(pl.lignes.length){const rid=enregistrer(b,pl.lignes,{date:d.debut,mode:d.modeAv||'Espèces',ref:'Avance à l’entrée'});setTimeout(()=>{if(db.settings.autoRecu!==false)A.recu(rid);},80);}}
    },'Confirmer l’entrée');
  if(!isAdmin())document.querySelectorAll('#mForm [name=loyer],#mForm [name=charges]').forEach(i=>{i.readOnly=true;i.title='Fixé par le Super admin';});
};

A.editBail=bid=>{
  const b=db.baux.find(x=>x.id===bid);
  let cl=b.loyer,cc=b.charges||0;(b.revisions||[]).forEach(r=>{cl=r.loyer;cc=r.charges;});
  modal('Modifier le bail',
    `<p class="muted"><b>${esc(bailNom(b))}</b> · ${esc(logNom(b.logementId))}</p>`+
    num('Loyer mensuel (FCFA)','loyer',cl)+num('Charges (FCFA)','charges',cc,false)+
    fld('Nouveau montant applicable à partir de','depuis',curMois(),'month')+
    `<p class="muted small">Les mois précédents gardent l’ancien montant (historique des révisions).</p>`+
    num('Jour d’échéance (1 à 31)','jour',b.jour)+
    fld('Fin prévue du bail','finPrevue',b.finPrevue||'','date',false)+
    num('Caution (FCFA)','caution',b.caution,false),
    d=>{
      const jour=Number(d.jour);
      if(!(jour>=1&&jour<=31))fail('Le jour d’échéance doit être entre 1 et 31');
      const nl=Number(d.loyer),nc=Number(d.charges)||0;
      if(!(nl>0))fail('Loyer invalide');
      if(nl!==Number(cl)||nc!==Number(cc)){
        if(!d.depuis)fail('Indiquez le mois d’application');
        if(d.depuis<=b.debut.slice(0,7)){b.loyer=nl;b.charges=nc;b.revisions=(b.revisions||[]).filter(r=>r.depuis>d.depuis);}
        else{b.revisions=(b.revisions||[]).filter(r=>r.depuis!==d.depuis);b.revisions.push({depuis:d.depuis,loyer:nl,charges:nc});b.revisions.sort((x,y)=>x.depuis.localeCompare(y.depuis));}
      }
      Object.assign(b,{jour,finPrevue:d.finPrevue||'',caution:Number(d.caution)||0});
      log('bail',`Bail de ${bailNom(b)} (${logNom(b.logementId)}) — loyer ${fcfa(nl+nc)}${d.depuis?' à partir de '+moisLabel(d.depuis):''} — échéance le ${jour}`,nl+nc,b.id);
    });
};

A.sortie=bid=>{
  const b=db.baux.find(x=>x.id===bid),a=arrieres(b),rp=reparationsLoc(b),rpt=sum(rp,chargeLoc);
  const mot=[a.tot?'Loyers impayés':'',...rp.map(i=>`Réparation : ${i.titre} (${fcfa(chargeLoc(i))})`)].filter(Boolean).join(' ; ');
  modal('Enregistrer la sortie',
    `<p class="muted"><b>${esc(bailNom(b))}</b> · ${esc(logNom(b.logementId))}<br>Entrée le ${fmtDate(b.debut)}</p>`+
    (a.tot?`<div class="alert a-neg">⚠️ Arriérés : ${fcfa(a.tot)} (${a.n} mois). Vous pouvez les retenir sur la caution.</div>`:'')+
    (rpt?`<div class="alert a-warn">🛠️ Réparations à sa charge non remboursées : ${fcfa(rpt)} — ${rp.map(i=>esc(i.titre)).join(', ')} (preuves dans Réparations).</div>`:'')+
    fld('Date de sortie','fin',today(),'date')+
    num('Caution retenue (FCFA)','retenue',Math.min(a.tot+rpt,b.caution),false)+
    fld('Motif de la retenue','motif',mot,'text',false)+
    `<label class="chk"><input type="checkbox" name="solder" ${a.tot?'checked':''}> Utiliser la retenue pour solder les arriérés</label>`+
    `<p class="muted">Caution versée : ${fcfa(b.caution)}. Le montant à restituer se calcule automatiquement.</p>`,
    d=>{
      if(!d.fin)fail('La date de sortie est requise');
      if(d.fin<b.debut)fail('La date de sortie est antérieure à l’entrée');
      const ret=Number(d.retenue)||0;
      if(ret>b.caution)fail('La retenue dépasse la caution versée');
      if(d.solder&&ret>0){const pl=planPaiement(b,Math.min(ret,a.tot));if(pl.lignes.length)enregistrer(b,pl.lignes,{date:d.fin,mode:'Retenue sur caution',ref:'Solde à la sortie'});}
      if(rpt&&ret>=a.tot+rpt)rp.forEach(i=>i.rembourse=true);
      Object.assign(b,{fin:d.fin,cautionRetenue:ret,cautionRestituee:b.caution-ret,motifRetenue:d.motif.trim()});
      log('sortie',`${bailNom(b)} quitte ${logNom(b.logementId)} — caution retenue ${fcfa(ret)}, restituée ${fcfa(b.caution-ret)}${d.motif.trim()?' — '+d.motif.trim():''}`,b.caution-ret,b.id);
    },'Confirmer la sortie');
};

const locData=d=>{if(!d.nom.trim())fail('Le nom est requis');return {nom:d.nom.trim(),tel:d.tel.trim(),email:d.email.trim(),profession:d.profession.trim(),piece:d.piece.trim(),urgence:d.urgence.trim(),notes:d.notes.trim()};};
A.addLocataire=()=>modal('Nouveau locataire',fLoc(),d=>{const t={id:uid(),...locData(d)};db.locataires.push(t);log('locataire','Ajout : '+t.nom);});
A.editLocataire=id=>{const t=locataire(id);modal('Modifier le locataire',fLoc(t),d=>{Object.assign(t,locData(d));log('locataire','Modification : '+t.nom);});};
A.delLocataire=async id=>{

  log('locataire','Suppression : '+(locataire(id)?.nom||''));db.locataires=db.locataires.filter(t=>t.id!==id);state.page='locataires';save();render();
};

/* ---------- Paiements intelligents : arriérés d'abord, puis mois en cours, puis avance ---------- */
const MAX_AVANCE=36;
function planPaiement(b,montant){
  const out=[],cur=moisLoyer(),lim=shift(cur,MAX_AVANCE),fin=b.fin?b.fin.slice(0,7):null;
  let left=montant;
  for(let m=b.debut.slice(0,7);left>0&&m<=lim&&(!fin||m<=fin);m=shift(m,1)){
    const du=montantDu(b,m),r=Math.max(0,du-payeBail(b.id,m));
    if(r>0){const a=Math.min(r,left);out.push({m,amt:a,du,reste:r-a});left-=a;}
  }
  return {lignes:out,surplus:left};
}
/* Montant nécessaire pour être à jour jusqu'au mois ym inclus */
function montantJusqua(b,ym){let s=0;for(let m=b.debut.slice(0,7);m<=ym;m=shift(m,1))s+=Math.max(0,montantDu(b,m)-payeBail(b.id,m));return s;}
/* Dernier mois entièrement payé sans trou depuis l'entrée */
function payeJusqua(b){
  let last=null;const lim=shift(moisLoyer(),MAX_AVANCE+1),fin=b.fin?b.fin.slice(0,7):null;
  for(let m=b.debut.slice(0,7);m<=lim&&(!fin||m<=fin);m=shift(m,1)){
    if(payeBail(b.id,m)>=montantDu(b,m))last=m;else break;
  }
  return last;
}
function avance(b){const cur=moisLoyer(),j=payeJusqua(b);if(!j||j<=cur)return {n:0,tot:0};let n=0,tot=0;for(let m=shift(cur,1);m<=j;m=shift(m,1)){n++;tot+=montantDu(b,m);}return {n,tot};}
function jusquaBadge(b){
  const j=payeJusqua(b),cur=moisLoyer();
  if(!j)return '<span class="badge neg">Aucun mois soldé</span>';
  if(j>cur)return `<span class="badge ok">✓ Avance jusqu’à ${moisLabel(j)}</span>`;
  if(j===cur)return `<span class="badge ok">À jour (${moisLabel(j)})</span>`;
  const nx=shift(j,1);
  return `<span class="badge ${echu(b,nx)&&!accordActif(b,nx)?'neg':'warn'}">Payé jusqu’à ${moisLabel(j)}</span>`;
}
function enregistrer(b,lignes,info){
  const rid=uid(),num=nextNum(),ts=new Date().toISOString(),par=state.uid||'';
  lignes.forEach(l=>db.paiements.push({id:uid(),bailId:b.id,mois:l.m,montant:l.amt,date:info.date,mode:info.mode,ref:info.ref||'',num,recu:rid,par,ts}));
  PIDX=null;
  log('paiement',`Reçu ${num} — ${bailNom(b)} (${logNom(b.logementId)}) — ${lignes.length>1?moisLabel(lignes[0].m)+' → '+moisLabel(lignes[lignes.length-1].m):moisLabel(lignes[0].m)} — ${info.mode}`,sum(lignes,l=>l.amt),rid,num);
  return rid;
}
function planHtml(b,montant){
  if(!(montant>0))return '<p class="muted small">Saisissez un montant.</p>';
  const {lignes,surplus}=planPaiement(b,montant);
  const last=lignes[lignes.length-1];
  const vis=lignes.length>7?[...lignes.slice(0,3),null,...lignes.slice(-3)]:lignes;
  return `<div class="plan"><b>Répartition automatique (${lignes.length} mois) :</b>${vis.map(l=>!l?'<div class="muted small">…</div>':`<div class="row"><span>${moisLabel(l.m)}${l.m>moisLoyer()?' <span class="badge ok">avance</span>':l.m<moisLoyer()?' <span class="badge neg">arriéré</span>':''}</span><span>${fcfa(l.amt)}${l.reste?` <span class="muted small">(reste ${fcfa(l.reste)})</span>`:''}</span></div>`).join('')}
  ${surplus>0?`<p class="neg small">⚠️ ${fcfa(surplus)} de trop : maximum ${MAX_AVANCE} mois d’avance${b.fin?' ou fin du bail':''}.</p>`:''}
  ${last?`<p class="ok small" style="margin:6px 0 0">${last.reste?`Le mois ${deM(last.m)} restera partiel.`:`✅ Loyer payé jusqu’à ${moisLabel(last.m)}.`}</p>`:''}</div>`;
}

/* Liste des reçus (paiements regroupés par transaction) */
function recus(pays){
  const g=new Map();
  pays.forEach(p=>{const k=p.recu||p.id;if(!g.has(k))g.set(k,[]);g.get(k).push(p);});
  return [...g.entries()].map(([rid,ps])=>{ps.sort((a,b)=>a.mois.localeCompare(b.mois));return {rid,ps,num:ps[0].num||'—',date:ps[0].date,mode:ps[0].mode,ref:ps[0].ref,bailId:ps[0].bailId,tot:sum(ps,x=>x.montant),de:ps[0].mois,a:ps[ps.length-1].mois};}).sort((a,b)=>b.date.localeCompare(a.date)||String(b.num).localeCompare(String(a.num)));

/* ---------- Reçu numérique ---------- */
function verif(rid,num,tot){let h=2166136261;for(const c of `${rid}|${num}|${tot}`){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}const s=(h>>>0).toString(36).toUpperCase().padStart(8,'0');return s.slice(0,4)+'-'+s.slice(4,8);}
function recuData(rid){
  const ps=db.paiements.filter(p=>(p.recu||p.id)===rid).sort((a,b)=>a.mois.localeCompare(b.mois));

  const p=ps[0],b=db.baux.find(x=>x.id===p.bailId),l=logement(b.logementId),tot=sum(ps,x=>x.montant);
  return {rid,num:p.num||'—',date:p.date,mode:p.mode,ref:p.ref,par:p.par||'',b,l,t:locataire(b.locataireId),im:imm(l?.immeubleId)||{},tot,
    lignes:ps.map(x=>{const du=montantDu(b,x.mois),paye=payeBail(b.id,x.mois);return {m:x.mois,amt:x.montant,du,solde:paye>=du,reste:Math.max(0,du-paye)};}),
    jusqua:payeJusqua(b),arr:arrieres(b).tot,code:verif(rid,p.num,tot),
    promesse:(()=>{const x=ps[ps.length-1],du=montantDu(b,x.mois),r=Math.max(0,du-payeBail(b.id,x.mois)),d=accordDate(b,x.mois);return r>0&&d?{m:x.mois,r,d}:null;})()};
}

function compressImg(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.6));};i.onerror=rej;i.src=r.result;};r.onerror=rej;r.readAsDataURL(f);});}

function incSave(i,d,fd){
  if(!d.logementId)fail('Choisissez un logement');
  if(!d.titre.trim())fail('Décrivez le problème');
  const art=fd.getAll('art'),q=fd.getAll('qte'),pu=fd.getAll('pu'),four=fd.getAll('four');
  const materiel=art.map((a,k)=>({art:a.trim(),qte:Number(q[k])||1,pu:Number(pu[k])||0,four:(four[k]||'').trim()})).filter(m=>m.art||m.pu);
  if(materiel.some(m=>m.pu<0))fail('Prix invalide');
  const mo=Number(d.mo)||0,cout=sum(materiel,matTot)+mo;
  Object.assign(i,{logementId:d.logementId,titre:d.titre.trim(),description:d.description.trim(),date:d.date,priorite:d.priorite,statut:d.statut,
    cause:d.cause,charge:d.charge,rembourse:d.charge!=='Propriétaire'&&!!d.rembourse,materiel,mo,artisan:d.artisan.trim(),artisanTel:d.artisanTel.trim(),cout,pieces:PJ.slice()});
  if(i.statut==='Résolu'&&!i.resolu)i.resolu=today();
  if(i.statut!=='Résolu')i.resolu='';
  const dep=i.depenseId&&db.depenses.find(x=>x.id===i.depenseId);
  const lib=`Réparation : ${i.titre} (${logNom(i.logementId)})`;
  if(dep){const av=dep.montant;Object.assign(dep,{montant:cout,libelle:lib,immeubleId:logement(i.logementId)?.immeubleId});if(av!==cout){if(!isAdmin())dep.statut='a_valider';log('depense_modif',`${lib} : ${fcfa(av)} → ${fcfa(cout)}`,cout,dep.id);}if(!cout){db.depenses=db.depenses.filter(x=>x!==dep);i.depenseId='';log('depense_suppr',lib,0,dep.id);}}
  else if(d.toDep&&i.statut==='Résolu'&&cout>0){const nd={id:uid(),immeubleId:logement(i.logementId)?.immeubleId,date:i.resolu||today(),cat:'Entretien / réparations',libelle:lib,montant:cout,incidentId:i.id,pieces:[],par:state.uid||'',statut:isAdmin()?'validee':'a_valider'};db.depenses.push(nd);i.depenseId=nd.id;log('depense',lib+(nd.statut==='a_valider'?' — à valider':''),cout,nd.id);}
}

function setLogo(f){
  if(!/^image\//.test(f.type))return toast('Choisissez une image');
  const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,256/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.settings.agence={...AG(),logo:c.toDataURL('image/png')};loadLogo();save();render();toast('Logo enregistré ✅');};i.onerror=()=>toast('Image illisible');i.src=r.result;};
  r.readAsDataURL(f);
}

A.contrat=bid=>{

  let cl=b.loyer,cc=b.charges||0;(b.revisions||[]).forEach(r=>{if(r.depuis<=curMois()){cl=r.loyer;cc=r.charges;}});
  const loyer=montantDu(b,curMois()),dur=b.finPrevue?`du ${fmtDate(b.debut)} au ${fmtDate(b.finPrevue)}`:`d’un (1) an à compter du ${fmtDate(b.debut)}`;
  const html=docHtml(`Contrat de bail — ${t?.nom||''}`,`${brandHtml()}<h1 style="text-align:center">CONTRAT DE BAIL ${pro?'À USAGE PROFESSIONNEL':'À USAGE D’HABITATION'}</h1>
<h2>Entre les soussignés</h2>
<p><b>Le bailleur :</b> ${esc(im.proprietaire||'________________________')}${im.contact?', tél. '+esc(im.contact):''}${a.nom?`, représenté par <b>${esc(a.nom)}</b>${a.tel?' ('+esc(a.tel)+')':''}`:''},</p>

<h2>Article 1 — Objet</h2><p>Le bailleur donne en location au locataire le logement <b>${esc(l?.nom||'')}</b> (${esc(l?.type||'')}, étage ${esc(l?.etage||'')}) situé dans l’immeuble <b>${esc(im.nom||'')}</b>, ${esc(im.adresse||'')}, à usage ${pro?'professionnel':'exclusif d’habitation'}.</p>
<h2>Article 2 — Durée</h2><p>Le bail est consenti pour une durée ${dur}. Il se renouvelle par tacite reconduction, sauf congé donné par l’une des parties avec un préavis d’au moins trois (3) mois.</p>
<h2>Article 3 — Loyer et charges</h2><p>Le loyer mensuel est fixé à <b>${fcfa(cl)}</b>${Number(cc)?` auquel s’ajoutent <b>${fcfa(cc)}</b> de charges, soit un total de <b>${fcfa(loyer)}</b>`:''} par mois, payable d’avance au plus tard le <b>${b.jour}</b> de chaque mois, en espèces, par Mobile Money ou par virement. Un reçu numéroté est remis pour chaque paiement.</p>
<h2>Article 4 — Dépôt de garantie (caution)</h2><p>Le locataire verse ce jour une caution de <b>${fcfa(b.caution)}</b>. Elle ne produit pas d’intérêts et sera restituée à la sortie, déduction faite des sommes restant dues et du coût des réparations locatives constatées par l’état des lieux de sortie.</p>
<h2>Article 5 — Obligations du locataire</h2><p>Le locataire s’engage à payer le loyer aux échéances convenues ; à user paisiblement des lieux ; à les entretenir et à effectuer les menues réparations ; à ne pas sous-louer ni céder le bail sans accord écrit du bailleur ; à ne pas transformer les lieux sans autorisation ; à payer ses consommations d’eau et d’électricité ; à laisser visiter les lieux pour les travaux nécessaires.</p>

/* ---------- Relances ---------- */
const TONS={courtois:'Courtois',ferme:'Ferme',dernier:'Dernier rappel'};
function aRelancer(){
  const out=[],cur=moisLoyer();
  BAUX().forEach(b=>{
    const t=locataire(b.locataireId);
    const a=arrieres(b);
    if(a.tot>0){
      const d0=echeanceDe(b,a.list[0].m);
      const promesseKo=a.list.some(x=>accordDate(b,x.m)&&!accordActif(b,x.m));
      out.push({b,t,type:'retard',montant:a.tot,jours:-jours(d0),detail:`${a.n} mois : ${a.list.map(x=>moisLabel(x.m)).join(', ')}`,promesseKo});
    }
    accords([b]).filter(x=>x.ok&&jours(x.d)<=3).forEach(x=>out.push({b,t,type:'promesse',montant:x.r,jours:jours(x.d),detail:`Reste ${deM(x.m)} promis le ${fmtDate(x.d)}`,m:x.m,d:x.d}));
    if(!b.fin&&bailActif(b,cur)){
      const s=statutBail(b,cur),ech=echeanceDe(b,cur),j=jours(ech);
      if(s.statut==='attente'&&j>=0&&j<=5)out.push({b,t,type:'avant',montant:s.reste,jours:j,detail:`Échéance ${deM(cur)} le ${fmtDate(ech)}`});
    }
  });
  const ord={retard:0,promesse:1,avant:2};
  return out.sort((x,y)=>ord[x.type]-ord[y.type]||y.montant-x.montant);
}
function msgRelance(r){
  const n=r.t?.nom||'',lg=logNom(r.b.logementId),sig=AG().nom?`\n\n${AG().nom}${AG().tel?' — '+AG().tel:''}`:(imm(logement(r.b.logementId)?.immeubleId)?.proprietaire?`\n\n${imm(logement(r.b.logementId)?.immeubleId).proprietaire}`:'');
  if(r.type==='avant')return `Bonjour ${n}, petit rappel amical : le loyer ${deM(moisLoyer())} pour le logement ${lg} (${fcfa(r.montant)}) arrive à échéance le ${fmtDate(echeanceDe(r.b,moisLoyer()))}. Vous pouvez payer en espèces ou par Mobile Money. Merci et bonne journée.${sig}`;
  if(r.type==='promesse')return `Bonjour ${n}, comme convenu, le reste du loyer ${deM(r.m)} pour ${lg}, soit ${fcfa(r.montant)}, est attendu le ${fmtDate(r.d)}. Merci de votre ponctualité.${sig}`;
  const ton=state.ton||'courtois';
  if(ton==='courtois')return `Bonjour ${n}, sauf erreur de notre part, nous n’avons pas encore reçu le règlement de ${fcfa(r.montant)} pour le logement ${lg} (${r.detail}). Merci de bien vouloir régulariser dès que possible. Si vous avez déjà payé, merci de ne pas tenir compte de ce message.${sig}`;
  if(ton==='ferme')return `Bonjour ${n}, malgré nos précédents rappels, la somme de ${fcfa(r.montant)} reste impayée pour le logement ${lg} (${r.detail}). Nous vous demandons de régulariser votre situation sous 72 heures. Merci de nous contacter pour tout arrangement.${sig}`;
  return `Bonjour ${n}, DERNIER RAPPEL avant mise en demeure : vous restez devoir ${fcfa(r.montant)} au titre des loyers du logement ${lg} (${r.detail}). Sans règlement ou accord sous 7 jours, nous serons contraints d’engager la procédure prévue au contrat de bail.${sig}`;
}

function releve(imId,ym){
  const im=imm(imId),lids=new Set(db.logements.filter(l=>l.immeubleId===imId).map(l=>l.id)),bids=new Set(db.baux.filter(b=>lids.has(b.logementId)).map(b=>b.id));
  const rc=recus(db.paiements.filter(p=>bids.has(p.bailId)&&p.date.slice(0,7)===ym));
  const deps=db.depenses.filter(d=>d.immeubleId===imId&&d.date.slice(0,7)===ym);
  const enc=sum(rc,r=>r.tot),dep=sum(deps,d=>d.montant),pct=Number(AG().commission)||0,com=Math.round(enc*pct/100);

}

/* --- SHA-256 / HMAC synchrones --- */
const K256=(()=>{const k=[],p=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true;};for(let n=2;k.length<64;n++)if(p(n))k.push((Math.pow(n,1/3)%1)*4294967296|0);return k;})();
const H256=(()=>{const h=[],p=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true;};for(let n=2;h.length<8;n++)if(p(n))h.push((Math.pow(n,1/2)%1)*4294967296|0);return h;})();
function sha256b(m){
  const l=m.length,bl=((l+9+63)>>6)<<6,b=new Uint8Array(bl);b.set(m);b[l]=0x80;
  const dv=new DataView(b.buffer);dv.setUint32(bl-4,(l*8)>>>0);dv.setUint32(bl-8,Math.floor(l*8/4294967296));
  const h=H256.slice(),w=new Int32Array(64);
  for(let o=0;o<bl;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))+w[i-7]+(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10)))|0;}
    let [a,bb,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){const t1=(hh+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K256[i]+w[i])|0,t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&bb)^(a&c)^(bb&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  const out=new Uint8Array(32),ov=new DataView(out.buffer);h.forEach((x,i)=>ov.setInt32(i*4,x));return out;
}
const utf8=s=>new TextEncoder().encode(s);
const hexb=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=s=>new Uint8Array((s.match(/../g)||[]).map(x=>parseInt(x,16)));
const sha=s=>hexb(sha256b(utf8(s)));
function hmacHex(key,msg){const kp=new Uint8Array(64);kp.set(key.length>64?sha256b(key):key);const ip=kp.map(x=>x^0x36),op=kp.map(x=>x^0x5c),m=utf8(msg);const a=new Uint8Array(64+m.length);a.set(ip);a.set(m,64);const inner=sha256b(a),o=new Uint8Array(96);o.set(op);o.set(inner,64);return hexb(sha256b(o));}
const b64e=b=>btoa(String.fromCharCode(...b));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveBits(pass,salt,it){const k=await crypto.subtle.importKey('raw',utf8(pass),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:utf8(salt),iterations:it,hash:'SHA-256'},k,256));}
async function wrapKey(raw,pass,salt){const ak=await crypto.subtle.importKey('raw',await deriveBits(pass,salt+'|w',150000),'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));return b64e(iv)+'.'+b64e(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},ak,raw)));}
async function unwrapKey(w,pass,salt){const [iv,ct]=w.split('.').map(b64d);const ak=await crypto.subtle.importKey('raw',await deriveBits(pass,salt+'|w',150000),'AES-GCM',false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},ak,ct));}
const randCode=n=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(n));return [...r].map(x=>A[x%A.length]).join('').replace(/(.{4})(?=.)/g,'$1-');};

/* --- Journal chaîné + points de contrôle signés --- */
const jPayload=e=>JSON.stringify([e.i,e.t,e.u,e.a,e.d,e.m||0,e.r||'',e.n||''])
function log(a,d,m=0,r='',n=''){
  if(!comptes())return;
  db.journal=db.journal||[];
  const prev=db.journal.length?db.journal[db.journal.length-1].h:'0';
  const e={i:db.journal.length,t:new Date().toISOString(),u:state.uid||'',a,d,m:Number(m)||0,r,n};
  if(CLOUD){e.id=uid();db.journal.push(e);return;}
  e.h=sha(prev+'|'+jPayload(e));db.journal.push(e);
}
function signer(){
  if(CLOUD)return;
  if(!ADMKEY||!(db.journal||[]).length)return;
  db.checkpoints=db.checkpoints||[];
  const last=db.journal[db.journal.length-1],cp=db.checkpoints[db.checkpoints.length-1];
  if(cp&&cp.i===last.i)return;
  db.checkpoints.push({i:last.i,h:last.h,t:new Date().toISOString(),sig:hmacHex(ADMKEY,last.i+'|'+last.h)});
}
function controle(){
  if(CLOUD)return AUDIT.filter(a=>['suppression','modification'].includes(a.kind)).map(a=>['neg',`${a.kind==='suppression'?'Paiement supprimé':'Montant modifié'} : reçu ${a.num||'?'} (${fcfa(a.montant)}) par ${a.qui||'?'}`]);
  const out=[],J=db.journal||[],CP=db.checkpoints||[];
  if(compromis()){out.push(['neg','Les comptes ont été supprimés des données alors qu’un journal existe : tentative de contournement.']);return out;}
  if(!comptes())return out;
  let prev='0',bad=-1;
  for(let k=0;k<J.length;k++){const e=J[k];if(e.i!==k||e.h!==sha(prev+'|'+jPayload(e))){bad=k;break;}prev=e.h;}
  if(bad>=0)out.push(['neg',`Le journal a été modifié ou des lignes ont été supprimées à partir de l’entrée n° ${bad+1} (${J[bad]?fmtDate(J[bad].t.slice(0,10)):'?'}).`]);
  CP.forEach(cp=>{const e=J[cp.i];if(!e||e.h!==cp.h)out.push(['neg',`Le point de contrôle du ${fmtDate(cp.t.slice(0,10))} ne correspond plus au journal : des actions passées ont été effacées ou réécrites.`]);else if(ADMKEY&&hmacHex(ADMKEY,cp.i+'|'+cp.h)!==cp.sig)out.push(['neg',`Signature du point de contrôle du ${fmtDate(cp.t.slice(0,10))} invalide (fausse signature).`]);});
  const ann=new Set(J.filter(e=>e.a==='annulation').map(e=>e.r));
  const rcs=new Map(recus(db.paiements).map(r=>[r.rid,r]));
  const nums=new Set();
  J.filter(e=>e.a==='paiement').forEach(e=>{if(e.n)nums.add(e.n);if(ann.has(e.r))return;const r=rcs.get(e.r);if(!r)out.push(['neg',`Le reçu n° ${e.n||'?'} de ${fcfa(e.m)} (${e.d}) a disparu sans annulation officielle.`]);else if(r.tot!==e.m)out.push(['neg',`Le reçu n° ${e.n||'?'} a été modifié : ${fcfa(e.m)} à l’origine, ${fcfa(r.tot)} aujourd’hui.`]);});
  const t0=J.length?J[0].t:'9';
  recus(db.paiements.filter(p=>p.ts&&p.ts>=t0)).forEach(r=>{if(!J.some(e=>e.a==='paiement'&&e.r===r.rid))out.push(['warn',`Le reçu n° ${r.num} (${fcfa(r.tot)}) a été ajouté en dehors du journal.`]);});
  const byY={};[...nums].forEach(n=>{const [y,s]=n.split('-');(byY[y]=byY[y]||[]).push(Number(s));});
  Object.entries(byY).forEach(([y,l])=>{l.sort((a,b)=>a-b);const miss=[];for(let k=l[0];k<l[l.length-1];k++)if(!l.includes(k))miss.push(`${y}-${String(k).padStart(4,'0')}`);if(miss.length)out.push(['warn',`Numéros de reçu sautés : ${miss.slice(0,8).join(', ')}${miss.length>8?'…':''} (reçus émis hors du journal ou supprimés).`]);});
  const maxN=Math.max(0,...[...nums].filter(n=>n.startsWith(today().slice(0,4))).map(n=>Number(n.split('-')[1])));
  if(maxN&&(db.settings.seq||0)<maxN)out.push(['neg','Le compteur des numéros de reçu a été remis en arrière.']);
  const depLog=new Map();J.forEach(e=>{if(['depense','depense_modif'].includes(e.a))depLog.set(e.r,e.m);if(['depense_suppr','depense_refus'].includes(e.a))depLog.delete(e.r);});
  depLog.forEach((m,id)=>{const d=db.depenses.find(x=>x.id===id);if(!d)out.push(['neg',`Une dépense de ${fcfa(m)} a été supprimée sans trace.`]);else if(d.montant!==m)out.push(['neg',`La dépense « ${d.libelle} » a été modifiée sans trace (${fcfa(m)} → ${fcfa(d.montant)}).`]);});
  return out;
}

async function connexion(login,pass){
  const btn=document.getElementById('loginBtn');
  if(Date.now()<BLOQUE)return toast(`Trop d’essais. Réessayez dans ${Math.ceil((BLOQUE-Date.now())/1000)} s.`);
  const l=normLogin(login);LOGIN.last=l;
  if(!l||!pass)return toast('Entrez votre nom d’utilisateur et votre mot de passe');
  const u=USERS().find(x=>x.login===l&&x.actif!==false);
  if(btn){btn.disabled=true;btn.textContent='Vérification…';}
  try{
    if(!u)throw 0;
    if(u.role==='admin'){const k=await unwrapKey(u.wrapP,pass,u.salt);if(!keyOk(k))throw 0;ADMKEY=k;try{sessionStorage.setItem(KEY+'_k',hexb(k));}catch(e){}}
    else{if(hexb(await deriveBits(pass,u.salt,60000))!==u.ver)throw 0;}
    state.uid=u.id;LAST_ACT=Date.now();LOGIN.last='';
    const pb=u.role==='admin'?controle():[];
    log('connexion',`${u.nom} (${ROLE[u.role]})`);
    if(u.role==='admin')signer();
    save();saveUi();state.page=u.role==='admin'&&pb.length?'journal':state.page;render();
    toast(u.role==='admin'&&pb.length?`⚠️ ${pb.length} anomalie(s) détectée(s) : voir le journal`:`Bienvenue ${u.nom} 👋`);
    ESSAIS=0;
  }catch(e){ESSAIS++;if(ESSAIS>=5){BLOQUE=Date.now()+30000*Math.min(10,ESSAIS-4);toast('Trop d’essais : connexion bloquée '+(30*Math.min(10,ESSAIS-4))+' s');}else toast('Nom d’utilisateur ou mot de passe incorrect');if(btn){btn.disabled=false;btn.textContent='Se connecter';}const i=document.getElementById('pinIn');if(i){i.value='';i.focus();}}
}
async function secours(code,pw){
  const u=adminU();if(!u)return;
  if(pw.length<6)return toast('Mot de passe : 6 caractères minimum');
  try{const k=await unwrapKey(u.wrapR,code.trim().toUpperCase(),u.salt);if(!keyOk(k))throw 0;u.wrapP=await wrapKey(k,pw,u.salt);ADMKEY=k;state.uid=u.id;try{sessionStorage.setItem(KEY+'_k',hexb(k));}catch(e){}log('secours','Mot de passe super admin réinitialisé avec le code de secours');signer();LOGIN.mode='login';save();saveUi();render();toast('Mot de passe changé ✅');}
  catch(e){toast('Code de secours incorrect');}
}

function caisse(uidG){
  const enc=recus(db.paiements.filter(p=>p.par===uidG&&modesCaisse().includes(p.mode)));
  const cau=db.baux.filter(b=>b.cautionPar===uidG&&b.caution>0);
  const deps=db.depenses.filter(d=>d.par===uidG&&d.statut!=='refusee'&&!d.incidentId);
  const rem=(db.remises||[]).filter(r=>r.par===uidG);
  const tEnc=sum(enc,r=>r.tot)+sum(cau,b=>b.caution),tDep=sum(deps,d=>d.montant),tConf=sum(rem.filter(r=>r.statut==='confirmee'),r=>r.montant),tAtt=sum(rem.filter(r=>r.statut==='attente'),r=>r.montant);
  return {enc,cau,deps,rem,tEnc,tDep,tConf,tAtt,solde:tEnc-tDep-tConf};
}

/* --- Fusion à 3 voies (deux appareils qui travaillent en même temps) --- */
const COLS=['immeubles','logements','locataires','baux','paiements','depenses','incidents','remises','annules','journal'];
const rid=(x,k)=>x.id||('k'+k+'|'+(x.t||'')+'|'+(x.i??''));
function merge3(base,loc,rem){
  const out=clone(rem),J=JSON.stringify;
  COLS.forEach(c=>{
    const B=new Map((base?.[c]||[]).map((x,k)=>[rid(x,k),x])),L=new Map((loc[c]||[]).map((x,k)=>[rid(x,k),x])),R=new Map((rem[c]||[]).map((x,k)=>[rid(x,k),x]));
    const res=[];const ids=new Set([...R.keys(),...L.keys()]);
    ids.forEach(id=>{const b=B.get(id),l=L.get(id),r=R.get(id);
      if(l&&r)res.push(b&&J(l)===J(b)?r:l);
      else if(l&&!r){if(!b||J(l)!==J(b))res.push(l);}
      else if(r&&!l){if(!b||J(r)!==J(b))res.push(r);}});
    out[c]=res;
  });
  const bs=base?.settings||{},ls=loc.settings||{},rs=rem.settings||{};out.settings={...rs};
  Object.keys(ls).forEach(k=>{if(J(ls[k])!==J(bs[k]))out.settings[k]=ls[k];});
  out.journal=(out.journal||[]).sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  // Numéros de reçu en double (deux appareils hors ligne) : renuméroter les reçus locaux
  const byNum=new Map();(out.paiements||[]).forEach(p=>{if(!p.num)return;const s=byNum.get(p.num)||new Set();s.add(p.recu||p.id);byNum.set(p.num,s);});
  const yr=today().slice(0,4),maxN=Math.max(Number(out.settings.seq)||0,...(out.paiements||[]).filter(p=>(p.num||'').startsWith(yr)).map(p=>Number(p.num.split('-')[1])||0));
  out.settings.seq=maxN;
  const remR=new Set((rem.paiements||[]).map(p=>p.recu||p.id));
  byNum.forEach((s,num)=>{if(s.size<2)return;[...s].filter(r=>!remR.has(r)).forEach(r=>{out.settings.seq++;const nn=`${yr}-${String(out.settings.seq).padStart(4,'0')}`;out.paiements.forEach(p=>{if((p.recu||p.id)===r)p.num=nn;});});});
  return out;
}

/* --- Synchronisation --- */
let NOUVELLE_CONNEXION=false,CHG_OK=0;
const enAttente=()=>CHG!==CHG_OK;
const cacheKey=()=>KEY+'_org_'+(SUP?'sup_'+SUP.id:(ORG?.id||''));
function cacheLocal(){try{localStorage.setItem(cacheKey(),JSON.stringify({data:db,base:BASE,version:VERSION,chg:enAttente()}));}catch(e){}}
let pushTimer=null;
function schedulePush(){if(!CLOUD||!PROFILE||!ORG_OK||!LOADED)return;CHG++;cacheLocal();if(navigator.onLine===false||HORS_LIGNE)setSync('📴 Hors ligne — '+(CHG-CHG_OK)+' modification(s) gardée(s) sur l’appareil','off');else setSync('⏳ Enregistrement…','wait');clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,navigator.onLine===false?60000:2500);}
async function pushNow(){
  clearTimeout(pushTimer);pushTimer=null;
  if(PUSHING){pushTimer=setTimeout(pushNow,800);return;}
  PUSHING=true;const c0=CHG;
  try{
    for(let essai=0;essai<4;essai++){
      await uploadPieces();
      const pl=payload();
      const {data,error}=await rpcSave(pl,VERSION);
      if(!error){VERSION=data;BASE=pl;cacheLocal();break;}
      if(/conflit/i.test(error.message)){const r=await rpcGet();if(r.error)throw r.error;const rem=r.data.data||{};db=migrate(clone(merge3(BASE||{},db,rem)));BASE=clone(rem);VERSION=r.data.version;PIDX=null;continue;}
      if(/Interdit|Accès refusé|Abonnement/i.test(error.message)){toast('⛔ '+cloudErr(error));await reloadRemote();break;}
      throw error;
    }
    if(CHG===c0)CHG_OK=c0;cacheLocal();
    setSync(CHG===c0?'☁️ Synchronisé':'⏳ Enregistrement…',CHG===c0?'ok':'wait');
    if(document.getElementById('modal').classList.contains('hidden'))render();
  }catch(e){setSync('📴 Hors ligne — '+(CHG-CHG_OK)+' modification(s) en attente, envoi au retour du réseau','off');HORS_LIGNE=true;pushTimer=setTimeout(pushNow,navigator.onLine===false?120000:60000);PUSHING=false;return;}
  PUSHING=false;
  if(CHG!==c0&&!pushTimer)pushTimer=setTimeout(pushNow,300);
}
async function reloadRemote(){const r=await rpcGet();if(r.error)throw r.error;const rem=r.data.data||{};db=migrate(clone(rem));BASE=clone(rem);VERSION=r.data.version;PIDX=null;LOADED=true;cacheLocal();if(document.getElementById('modal').classList.contains('hidden'))render();}
async function poll(force){
  if(!CLOUD||!PROFILE||!ORG_OK||!LOADED||PUSHING||pushTimer)return;
  if(navigator.onLine===false){HORS_LIGNE=true;setSync('📴 Hors ligne — vos modifications sont gardées','off');return;}
  NPOLL++;
  try{
    const me=(force||NPOLL%5===1||HORS_LIGNE)?await SB.rpc('me'):{};
    if(me.error&&estReseau(me.error))throw me.error;
    if(!me.error&&me.data){cacheMe(me.data);if(!SUP)ORG={...ORG,...me.data.org};else ORG_MOI={...ORG_MOI,...me.data.org};PROFILE={...PROFILE,...me.data.profile,login:me.data.profile.username};if(!me.data.ok){ORG_OK=false;AUTH={mode:'attente'};render();renderLock();return;}}
    if(isAdmin()&&(force||NPOLL%5===1))refreshTeam();
    const {data,error}=await rpcVersion();if(error)throw error;
    if(HORS_LIGNE){HORS_LIGNE=false;if(enAttente()&&!pushTimer){pushNow();return;}}
    if(data>VERSION&&!PUSHING){await reloadRemote();setSync('☁️ Synchronisé','ok');}
    else setSync('☁️ Synchronisé','ok');
  }catch(e){setSync('📴 Hors ligne','off');}
}
let DERNIER_POLL=0;
setInterval(()=>{const pas=ECO()?300000:60000;if(document.visibilityState==='visible'&&Date.now()-DERNIER_POLL>=pas-500){DERNIER_POLL=Date.now();poll();}},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-DERNIER_POLL>20000){DERNIER_POLL=Date.now();poll(true);}});
window.addEventListener('online',()=>{if(CLOUD&&PROFILE){HORS_LIGNE=false;setSync('🔄 Reconnexion…','wait');if(enAttente())pushNow();else poll(true);}});

async function refreshTeam(){try{const {data}=await (SUP?SB.rpc('platform_team',{p_org:SUP.id}):SB.rpc('team'));MEMBERS=(data||[]).map(u=>({id:u.id,nom:u.nom,login:u.username,tel:u.tel,role:u.role,supprime:!!u.supprime,actif:u.actif}));}catch(e){}}

async function cloudBoot(){
  AUTH.mode='loading';renderLock();
  let {data,error}=await SB.rpc('me');
  if(error&&estReseau(error)){
    let c=null;try{c=JSON.parse(localStorage.getItem(KEY+'_me')||'null');}catch(e){}
    const {data:{session}}=await SB.auth.getSession();
    if(c&&session&&c.profile?.id===session.user?.id){data=c;error=null;HORS_LIGNE=true;}
    else{AUTH={mode:'login',msg:'Pas de connexion internet. La toute première connexion sur cet appareil doit se faire avec internet.'};PROFILE=null;renderLock();return;}
  }
  if(error){AUTH={mode:'login',msg:cloudErr(error)};PROFILE=null;renderLock();return;}
  if(!HORS_LIGNE)cacheMe(data);
  if(!data){AUTH={mode:'login',msg:'Ce compte a été supprimé ou n’existe plus. Contactez votre Super admin ou l’équipe GestImmo.'};await SB.auth.signOut();renderLock();return;}
  PROFILE={...data.profile,login:data.profile.username};ORG=data.org;ORG_OK=!!data.ok;PLAT=data.plateforme||{};state.uid=PROFILE.id;LAST_ACT=Date.now();
  if(!ORG_OK){AUTH={mode:'attente'};render();renderLock();return;}
  try{const c=JSON.parse(localStorage.getItem(cacheKey())||'null');if(c){db=migrate(c.data);BASE=clone(c.base||{});VERSION=c.version;LOADED=true;if(c.chg){CHG=CHG_OK+1;}render();}}catch(e){}
  if(HORS_LIGNE){if(!LOADED){AUTH={mode:'login',msg:'Pas de connexion internet et aucune donnée enregistrée sur cet appareil.'};PROFILE=null;renderLock();return;}
    loadLogo();state.page=state.page||'dash';render();setSync('📴 Hors ligne — vos modifications sont gardées','off');toast('📴 Mode hors ligne : vous travaillez sur les données de cet appareil');return;}
  try{
    const r=await SB.rpc('get_data');if(r.error)throw r.error;
    const rem=r.data.data||{};
    if(LOADED&&CHG>0&&BASE){db=migrate(clone(merge3(BASE,db,rem)));}else db=migrate(clone(rem));
    BASE=clone(rem);VERSION=r.data.version;LOADED=true;PIDX=null;
  }catch(e){if(!LOADED){AUTH={mode:'login',msg:cloudErr(e)};renderLock();return;}}
  await refreshTeam();await refreshAudit();
  if(NOUVELLE_CONNEXION){NOUVELLE_CONNEXION=false;log('connexion',`${PROFILE.nom} (${ROLE[PROFILE.role]})`);CHG++;}
  loadLogo();cacheLocal();state.page=state.page||'dash';render();
  if(enAttente()){CHG--;schedulePush();}else setSync('☁️ Synchronisé','ok');
  const j=ORG.expire_le?jours(ORG.expire_le):null;
  toast(j!==null&&j<=7?`⚠️ Votre abonnement expire ${j<=0?'aujourd’hui':'dans '+j+' jour(s)'}`:`Bienvenue ${PROFILE.nom} 👋`);
}

const emailOf=u=>`${normLogin(u)}@${DOMAIN}`;
async function cloudLogin(u,p){
  if(!normLogin(u)||!p)return toast('Entrez votre nom d’utilisateur et votre mot de passe');
  if(Date.now()<BLOQUE)return toast(`Trop d’essais. Réessayez dans ${Math.ceil((BLOQUE-Date.now())/1000)} s.`);
  AUTH.last=normLogin(u);busy(true);
  const {error}=await SB.auth.signInWithPassword({email:emailOf(u),password:p});
  busy(false);
  if(error){ESSAIS++;if(ESSAIS>=5)BLOQUE=Date.now()+30000*Math.min(10,ESSAIS-4);AUTH.msg=cloudErr(error);renderLock();return;}
  ESSAIS=0;AUTH.msg='';NOUVELLE_CONNEXION=true;await cloudBoot();
}
function busy(on){const b=document.querySelector('#lockForm button.primary');if(b){b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent='Patientez…';}else if(b.dataset.t)b.textContent=b.dataset.t;}}
async function cloudSignup(f,join){
  const lg=normLogin(f.login);
  if(join&&!f.code.trim())return toast('Entrez le code d’invitation');
  if(!f.nom.trim())return toast('Indiquez votre nom complet');
  if(lg.length<3)return toast('Nom d’utilisateur : 3 caractères minimum (lettres, chiffres, . _ -)');
  if(f.p1.length<6)return toast('Mot de passe : 6 caractères minimum');
  if(f.p1!==f.p2)return toast('Les deux mots de passe ne correspondent pas');
  busy(true);
  try{
    const lib=await SB.rpc('username_libre',{p_username:lg});if(lib.data===false)throw new Error('Ce nom d’utilisateur est déjà pris');
    const {data,error}=await SB.auth.signUp({email:emailOf(lg),password:f.p1,options:{data:{username:lg,nom:f.nom.trim()}}});
    if(error)throw error;
    if(!data.session)throw new Error('Inscription impossible : la confirmation par e-mail est activée sur le serveur.');
    const r=join?await SB.rpc('join_org',{p_code:f.code,p_username:lg,p_nom:f.nom,p_tel:f.tel}):await SB.rpc('register_owner',{p_username:lg,p_nom:f.nom,p_tel:f.tel,p_agence:f.agence||''});
    if(r.error){await SB.auth.signOut();throw r.error;}
    busy(false);AUTH={mode:'loading'};NOUVELLE_CONNEXION=true;await cloudBoot();
    if(r.data?.role==='plateforme')setTimeout(()=>toast('👑 Vous êtes le propriétaire de la plateforme GestImmo'),1500);
  }catch(e){busy(false);AUTH.msg=cloudErr(e);renderLock();}
}
async function cloudLogout(){

  SUP=null;ORG_MOI=null;PLAT_TEAM=null;PLAT_TEAM_ORG=null;PROFILE=null;ORG=null;ORG_OK=false;LOADED=false;MEMBERS=[];AUDIT=[];BASE=null;VERSION=0;CHG=0;CHG_OK=0;state.uid=null;db=emptyDb();PIDX=null;

function renderAuth(){
  const box=document.getElementById('lockForm'),m=AUTH.mode,msg=AUTH.msg?`<div class="alert a-neg" style="text-align:left"><span>⚠️</span><span>${esc(AUTH.msg)}</span></div>`:'';
  const head=t=>`<img src="${MARK}" width="56" height="56" alt="" style="display:block;margin:0 auto 6px"><h2 style="margin:0">Gest<span style="color:#d98a0b">Immo</span></h2><p class="muted" style="margin:2px 0 12px">${t}</p>`;
  const F=(l,id,t='text',x='')=>`<label style="text-align:left">${l}<input id="${id}" type="${t}" ${x}></label>`;
  const link=(t,mode)=>`<button type="button" class="linkbtn small" data-a="authMode" data-id="${mode}">${t}</button>`;
  if(m==='loading'){box.innerHTML=head('Connexion en cours…')+'<div class="spin"></div>';return;}
  if(m==='erreur'){box.innerHTML=head('Impossible de charger l’application')+'<p class="neg">Vérifiez votre connexion internet puis réessayez.</p><button class="primary" type="button" onclick="location.reload()">Réessayer</button>';return;}
  if(m==='attente'){
    const susp=ORG?.statut==='suspendue',exp=ORG?.statut==='active'&&ORG?.expire_le&&ORG.expire_le<today();
    const t=susp?'Votre compte est suspendu.':exp?`Votre abonnement a expiré le ${fmtDate(ORG.expire_le)}.`:PROFILE&&PROFILE.actif===false?'Votre accès a été désactivé par votre Super admin.':'Votre compte a bien été créé ✅ Il attend l’activation par l’équipe GestImmo.';
    const wmsg=`Bonjour, ${susp||exp?'je souhaite réactiver':'je viens de créer'} mon compte GestImmo.\nNom : ${PROFILE?.nom||''}\nUtilisateur : ${PROFILE?.username||''}\nAgence : ${ORG?.nom||''}\nMerci ${susp||exp?'de le réactiver':'de l’activer'}.`;
    box.innerHTML=head(susp||exp?'Accès suspendu':'Activation en attente')+`<p>${t}</p>${PLAT.message?`<p class="muted small">${esc(PLAT.message)}</p>`:''}
      ${PLAT.whatsapp?`<a class="btn wa" style="display:block;margin:8px 0" href="${esc(waPlat(wmsg))}" target="_blank" rel="noopener">📲 Contacter GestImmo sur WhatsApp</a>`:''}
      <button type="button" class="ghost" style="width:100%" data-a="authRefresh">🔄 Vérifier à nouveau</button><button type="button" class="linkbtn small" style="margin-top:10px" data-a="logout">Se déconnecter</button>`;return;}
  if(m==='signup'){box.innerHTML=head('Créer mon compte propriétaire / agence')+msg+F('Nom complet','suNom','text','autocomplete="name"')+F('Nom d’utilisateur (pour vous connecter)','suLogin','text','autocapitalize="none" autocomplete="username" placeholder="ex : awa"')+F('Téléphone (WhatsApp)','suTel','tel')+F('Nom de votre agence (facultatif)','suAgence')+F('Mot de passe (6 caractères min.)','suP1','password','autocomplete="new-password"')+F('Confirmer le mot de passe','suP2','password','autocomplete="new-password"')+
    `<button class="primary" style="width:100%;margin-top:4px">Créer mon compte</button><p class="muted small">Votre compte sera activé par l’équipe GestImmo.</p>${link('J’ai déjà un compte → Se connecter','login')}`;return;}
  if(m==='join'){box.innerHTML=head('Rejoindre une agence (gestionnaire)')+msg+F('Code d’invitation (donné par votre Super admin)','joCode','text','autocapitalize="characters" style="text-transform:uppercase;letter-spacing:3px;text-align:center"')+F('Nom complet','suNom')+F('Nom d’utilisateur','suLogin','text','autocapitalize="none" placeholder="ex : koffi"')+F('Téléphone','suTel','tel')+F('Mot de passe (6 caractères min.)','suP1','password','autocomplete="new-password"')+F('Confirmer le mot de passe','suP2','password','autocomplete="new-password"')+
    `<button class="primary" style="width:100%;margin-top:4px">Rejoindre l’agence</button>${link('J’ai déjà un compte → Se connecter','login')}`;return;}
  if(m==='oubli'){box.innerHTML=head('Mot de passe oublié')+`<p class="muted" style="text-align:left">• <b>Gestionnaire</b> : demandez à votre Super admin de vous créer un nouveau mot de passe (Paramètres → Équipe).<br>• <b>Propriétaire / agence</b> : contactez l’équipe GestImmo.</p>${PLAT.whatsapp?`<a class="btn wa" style="display:block;margin:8px 0" href="${esc(waPlat('Bonjour, j’ai oublié mon mot de passe GestImmo. Mon nom d’utilisateur est : '))}" target="_blank" rel="noopener">📲 Contacter GestImmo</a>`:''}${link('← Retour à la connexion','login')}`;return;}
  box.innerHTML=head('Connectez-vous à votre compte')+msg+F('Nom d’utilisateur','loginIn','text',`autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(AUTH.last||'')}"`)+
    `<label style="text-align:left">Mot de passe<div class="pw"><input id="pinIn" type="password" autocomplete="current-password"><button type="button" class="ghost sm" data-a="voirMdp" title="Afficher">👁</button></div></label>
    <button class="primary" style="width:100%;margin-top:4px" id="loginBtn">Se connecter</button>
    <div class="auth-links">${link('Mot de passe oublié ?','oubli')}</div>
    <div class="auth-new"><p class="muted small" style="margin:0 0 6px">Pas encore de compte ?</p><button type="button" class="ghost" style="width:100%" data-a="authMode" data-id="signup">🏢 Créer un compte propriétaire / agence</button><button type="button" class="ghost" style="width:100%;margin-top:6px" data-a="authMode" data-id="join">👤 Je suis gestionnaire (code d’invitation)</button></div>`;
  setTimeout(()=>document.getElementById(AUTH.last?'pinIn':'loginIn')?.focus(),50);
}
A.authMode=m=>{AUTH={mode:m,last:AUTH.last};renderLock();};
A.authRefresh=()=>cloudBoot();
function cloudSubmit(){
  const v=id=>document.getElementById(id)?.value||'';
  if(AUTH.mode==='login')return cloudLogin(v('loginIn'),v('pinIn'));
  if(AUTH.mode==='signup')return cloudSignup({nom:v('suNom'),login:v('suLogin'),tel:v('suTel'),agence:v('suAgence'),p1:v('suP1'),p2:v('suP2')},false);
  if(AUTH.mode==='join')return cloudSignup({code:v('joCode'),nom:v('suNom'),login:v('suLogin'),tel:v('suTel'),p1:v('suP1'),p2:v('suP2')},true);
}

/* --- Équipe (Super admin de l'agence) --- */
function cardEquipe(){
  const code=ORG?.code||'';
  const inv=`Bonjour, voici votre accès à GestImmo pour l’agence ${ORG?.nom||''} :\n1) Ouvrez ${location.origin+location.pathname}\n2) Touchez « Je suis gestionnaire »\n3) Code d’invitation : ${code}`;
  const plat=PROFILE?.role==='plateforme';
  return `<div class="card"><h3 style="margin-top:0">👥 Équipe & accès — ${esc(ORG?.nom||'')}</h3>
  ${SUP?'<p class="muted small">👑 Mode supervision : vous gérez les comptes de cette agence.</p>':`<div class="row"><div><p class="muted small" style="margin:0">Code d’invitation pour vos gestionnaires</p><p class="code-secours" style="margin:6px 0;font-size:20px">${esc(code)}</p></div>
  <div class="btns" style="margin:0"><a class="btn wa sm" href="${esc(waLink('',inv))}" target="_blank" rel="noopener">Envoyer par WhatsApp</a><button class="sm ghost" data-a="copierCode">📋 Copier</button><button class="sm ghost" data-a="nouveauCode">🔄 Nouveau code</button></div></div>`}
  ${tbl([['Nom'],['Nom d’utilisateur'],['Rôle'],['Téléphone'],['État'],['','act']],MEMBERS.filter(u=>!u.supprime).map(u=>{const gerable=u.id!==PROFILE?.id&&u.role!=='plateforme'&&(u.role==='gestionnaire'||plat);return [`<b>${esc(u.nom)}</b>`,`<code>${esc(u.login)}</code>`,`${u.role==='gestionnaire'?'👤':'👑'} ${ROLE[u.role]}`,esc(u.tel||'—'),u.actif===false?'<span class="badge neg">Désactivé</span>':'<span class="badge ok">Actif</span>',
    gerable?`<button class="sm ghost" data-a="resetMdp" data-id="${u.id}">Nouveau mot de passe</button><button class="sm ${u.actif===false?'':'ghost'}" data-a="toggleMembre" data-id="${u.id}">${u.actif===false?'Réactiver':'Désactiver'}</button><button class="sm danger" data-a="supprimerMembre" data-id="${u.id}">🗑️ Supprimer</button>`:''];}),'Aucun membre.')}
  ${MEMBERS.some(u=>u.supprime)?`<p class="muted small">Comptes supprimés (gardés dans l’historique) : ${MEMBERS.filter(u=>u.supprime).map(u=>esc(u.nom)).join(', ')}</p>`:''}
  <div class="btns"><button class="sm ghost" data-a="modesCaisse">💵 Argent géré par le gestionnaire</button><button class="sm ghost" data-a="goto" data-id="journal">🛡️ Journal serveur</button><button class="sm ghost" data-a="monMdpCloud">🔑 Changer mon mot de passe</button></div>
  ${ORG?.expire_le?`<p class="muted small">Abonnement valable jusqu’au <b>${fmtDate(ORG.expire_le)}</b>.</p>`:''}</div>`;
}
A.supprimerMembre=id=>{const u=MEMBERS.find(x=>x.id===id)||(PLAT_TEAM||[]).find(x=>x.id===id);if(!u)return;
  modal(`Supprimer le compte de ${u.nom}`,`<p>Le compte <b>${esc(u.nom)}</b> (<code>${esc(u.login||u.username||'')}</code>, ${ROLE[u.role]||u.role}) sera <b>définitivement supprimé</b> : il ne pourra plus se connecter.</p><p class="muted small">Ses reçus, paiements et actions passées restent dans l’historique avec son nom. Pour bloquer temporairement, utilisez plutôt « Désactiver ».</p>${u.role==='admin'?'<div class="alert a-warn"><span>⚠️</span><span>C’est le Super admin de l’agence : l’agence n’aura plus d’administrateur. Pour supprimer toute l’agence, utilisez « Supprimer l’agence » dans la console.</span></div>':''}`+fld(`Pour confirmer, tapez SUPPRIMER`,'conf',''),
  d=>{if(d.conf.trim().toUpperCase()!=='SUPPRIMER')fail('Tapez SUPPRIMER pour confirmer');(async()=>{const {error}=await SB.rpc('delete_member',{p_user:id});if(error)return toast(cloudErr(error));closeModal();await refreshTeam();if(PLAT_TEAM_ORG)await chargerPlatTeam(PLAT_TEAM_ORG);render();toast('Compte supprimé ✅');})();return false;},'Supprimer définitivement');};

  d=>{if(d.p1.length<6)fail('6 caractères minimum');(async()=>{const {error}=await SB.rpc('reset_password',{p_user:id,p_new:d.p1});if(error)return toast(cloudErr(error));closeModal();toast('Mot de passe changé ✅');})();return false;});};

  d=>{if(d.p1.length<6)fail('6 caractères minimum');if(d.p1!==d.p2)fail('Les mots de passe ne correspondent pas');(async()=>{const {error}=await SB.auth.updateUser({password:d.p1});if(error)return toast(cloudErr(error));log('comptes','Mot de passe changé par '+PROFILE.nom);save();closeModal();toast('Mot de passe changé ✅');})();return false;});

/* --- Console du propriétaire de la plateforme --- */
async function loadPlat(){const {data,error}=await SB.rpc('platform_orgs');if(error){toast(cloudErr(error));return;}PLAT_ORGS=data||[];if(state.page==='plateforme')render();}
function pagePlateforme(){
  if(PROFILE?.role!=='plateforme')return '<p>Accès réservé.</p>';
  if(!PLAT_ORGS){loadPlat();return '<h2>👑 Plateforme GestImmo</h2><div class="spin"></div>';}
  const L=PLAT_ORGS.filter(o=>o.proprietaire?.role!=='plateforme'),f=state.pf||'tous';
  const exp=o=>o.statut==='active'&&o.expire_le&&o.expire_le<today();
  const st=o=>exp(o)?'<span class="badge neg">Expiré</span>':o.statut==='active'?'<span class="badge ok">Actif</span>':o.statut==='en_attente'?'<span class="badge warn">En attente</span>':'<span class="badge neg">Suspendu</span>';
  const V=L.filter(o=>f==='tous'||(f==='attente'&&o.statut==='en_attente')||(f==='actifs'&&o.statut==='active'&&!exp(o))||(f==='bloques'&&(o.statut==='suspendue'||exp(o))));
  return `<div class="row"><h2>👑 Plateforme GestImmo</h2><button class="sm ghost" data-a="platReload">🔄 Actualiser</button></div>
  <div class="grid">${kpi('Clients inscrits',String(L.length))}${kpi('En attente d’activation',String(L.filter(o=>o.statut==='en_attente').length),'',L.some(o=>o.statut==='en_attente')?'neg':'')}${kpi('Abonnements actifs',String(L.filter(o=>o.statut==='active'&&!exp(o)).length),'','ok')}</div>
  <div class="card"><h3 style="margin-top:0">📲 Contact affiché aux nouveaux clients</h3><div class="grid2">${fld('Votre numéro WhatsApp','plWa',PLAT.whatsapp||'','tel',false).replace('name="plWa"','id="plWa"')}${fld('Message (tarifs, conditions…)','plMsg',PLAT.message||'','text',false).replace('name="plMsg"','id="plMsg"')}</div><button class="sm primary" data-a="platSave">Enregistrer</button></div>
  <div class="seg">${[['tous','Tous'],['attente','En attente'],['actifs','Actifs'],['bloques','Suspendus / expirés']].map(([k,t])=>`<button class="${f===k?'on':''}" data-a="platF" data-id="${k}">${t}</button>`).join('')}</div>
  ${tbl([['Agence / propriétaire'],['Inscrit le'],['Utilisation'],['Statut'],['Expire le'],['','act']],V.map(o=>{const p=o.proprietaire||{};const msg=`Bonjour ${p.nom||''}, votre compte GestImmo (${o.nom}) est ${o.statut==='active'?'activé ✅':'en attente'}.`;return [
    `<b>${esc(o.nom)}</b><div class="muted small">${esc(p.nom||'')} · <code>${esc(p.username||'')}</code>${p.tel?' · '+esc(p.tel):''}</div>${o.note?`<div class="muted small">📝 ${esc(o.note)}</div>`:''}`,
    fmtDate(String(o.created_at).slice(0,10)),`${o.immeubles} imm. · ${o.logements} log. · ${o.locataires} loc. · ${o.membres} compte(s)`,st(o),o.expire_le?fmtDate(o.expire_le)+(o.statut==='active'?` <span class="muted small">(${jours(o.expire_le)} j)</span>`:''):'—',
    `<button class="sm primary" data-a="platEdit" data-id="${o.id}">${o.statut==='active'?'Abonnement':'Activer'}</button><button class="sm" data-a="superviser" data-id="${o.id}">👁️ Ouvrir</button><button class="sm ghost" data-a="platEquipe" data-id="${o.id}">👥 Comptes</button><button class="sm danger" data-a="supprimerOrg" data-id="${o.id}">🗑️</button>${p.tel?`<a class="btn wa sm" href="${esc(waLink(p.tel,msg))}" target="_blank" rel="noopener">WhatsApp</a>`:''}${p.id?`<button class="sm ghost" data-a="resetMdp" data-id="${p.id}">Mot de passe</button>`:''}`];}),'Aucun client.')}`;
}

  d=>{(async()=>{const {error}=await SB.rpc('delete_org',{p_org:orgId,p_confirm:d.conf});if(error)return toast(cloudErr(error));closeModal();PLAT_ORGS=null;render();toast('Agence supprimée');})();return false;},'Supprimer définitivement');};
A.superviser=async orgId=>{
  const o=PLAT_ORGS.find(x=>x.id===orgId);if(!o)return;
  try{if(pushTimer){await pushNow();}}catch(e){}
  if(!SUP)ORG_MOI=ORG;
  SUP={id:o.id,nom:o.nom};ORG={id:o.id,nom:o.nom,statut:o.statut,expire_le:o.expire_le};
  LOADED=false;BASE=null;VERSION=0;CHG=0;CHG_OK=0;db=emptyDb();PIDX=null;AUDIT=[];state.imm='all';state.page='dash';
  setSync('⏳ Ouverture…','wait');
  try{const r=await rpcGet();if(r.error)throw r.error;db=migrate(clone(r.data.data||{}));BASE=clone(r.data.data||{});VERSION=r.data.version;LOADED=true;}catch(e){toast(cloudErr(e));return A.finSupervision();}
  await refreshTeam();await refreshAudit();loadLogo();render();setSync('☁️ Synchronisé','ok');toast(`👁️ Vous supervisez ${o.nom}`);
};
A.finSupervision=async()=>{
  try{if(pushTimer){await pushNow();}}catch(e){}
  SUP=null;ORG=ORG_MOI||ORG;LOADED=false;BASE=null;VERSION=0;CHG=0;CHG_OK=0;db=emptyDb();AUDIT=[];state.page='plateforme';PLAT_ORGS=null;
  try{const c=JSON.parse(localStorage.getItem(cacheKey())||'null');if(c){db=migrate(c.data);BASE=clone(c.base||{});VERSION=c.version;}}catch(e){}
  try{const r=await rpcGet();if(!r.error){db=migrate(clone(r.data.data||{}));BASE=clone(r.data.data||{});VERSION=r.data.version;}}catch(e){}
  LOADED=true;await refreshTeam();await refreshAudit();loadLogo();render();toast('Retour à votre agence');
};
A.platF=v=>{state.pf=v;render();};
A.platSave=async()=>{const {error}=await SB.rpc('platform_settings',{p_whatsapp:document.getElementById('plWa').value.trim(),p_message:document.getElementById('plMsg').value.trim()});if(error)return toast(cloudErr(error));PLAT={whatsapp:document.getElementById('plWa').value.trim(),message:document.getElementById('plMsg').value.trim()};toast('Enregistré ✅');};
A.platEdit=id=>{const o=PLAT_ORGS.find(x=>x.id===id);const addM=n=>{const d=new Date(Math.max(Date.now(),o.expire_le?new Date(o.expire_le+'T00:00:00').getTime():0));d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);};
  modal(`Abonnement — ${o.nom}`,sel('Statut','statut',[['active','✅ Actif'],['en_attente','⏳ En attente'],['suspendue','⛔ Suspendu']],o.statut==='en_attente'?'active':o.statut)+
  fld('Valable jusqu’au (vide = sans limite)','expire',o.expire_le||addM(1),'date',false)+`<div class="btns" style="margin-top:0">${[1,3,6,12].map(n=>`<button type="button" class="sm ghost" data-a="platExp" data-id="${addM(n)}">+${n} mois</button>`).join('')}<button type="button" class="sm ghost" data-a="platExp" data-id="">Sans limite</button></div>`+
  fld('Note (paiement reçu, forfait…)','note',o.note||'','text',false),
  d=>{(async()=>{const {error}=await SB.rpc('platform_set',{p_org:id,p_statut:d.statut,p_expire:d.expire||null,p_note:d.note});if(error)return toast(cloudErr(error));closeModal();PLAT_ORGS=null;render();toast('Abonnement mis à jour ✅');})();return false;},'Enregistrer');};
A.platExp=v=>{const i=document.querySelector('#mForm [name=expire]');if(i)i.value=v;};

/* --- Journal serveur (Super admin) --- */
const AKIND={paiement:'💰 Paiement',annulation:'❌ Annulation',suppression:'🚨 Suppression',modification:'🚨 Montant modifié',depense:'🧾 Dépense',depense_modif:'✏️ Dépense modifiée',depense_suppr:'🗑️ Dépense supprimée',membre:'👥 Équipe',inscription:'🆕 Inscription',abonnement:'👑 Abonnement'};
function pageJournalCloud(){
  if(!AUDIT.length)refreshAudit().then(()=>{if(state.page==='journal'&&AUDIT.length)render();});
  const al=AUDIT.filter(a=>['suppression','modification'].includes(a.kind));
  return `<div class="row"><h2>🛡️ Journal serveur</h2><button class="sm ghost" data-a="auditReload">🔄 Actualiser</button></div>
  <div class="card"><p class="muted" style="margin-top:0">Ce journal est tenu <b>par le serveur</b> : personne ne peut l’effacer ou le modifier depuis l’application. Le serveur <b>refuse</b> qu’un gestionnaire supprime ou modifie un paiement, supprime une dépense ou change un loyer.</p>
  ${al.length?al.map(a=>`<div class="alert a-neg"><span>🚨</span><span>${esc(AKIND[a.kind])} — reçu ${esc(a.num||'?')} (${fcfa(a.montant)}) par ${esc(a.qui||'?')} le ${fmtDate(String(a.at).slice(0,10))}</span></div>`).join(''):'<p class="ok-msg">✅ Aucun paiement supprimé ou modifié en dehors d’une annulation officielle.</p>'}</div>
  ${tbl([['Date & heure'],['Qui'],['Action'],['Détail'],['Montant','n']],AUDIT.map(a=>[`${fmtDate(String(a.at).slice(0,10))} ${String(a.at).slice(11,16)}`,esc(a.qui||'—'),AKIND[a.kind]||esc(a.kind),esc([a.num?'Reçu '+a.num:'',a.detail].filter(Boolean).join(' — ')),a.montant?fcfa(a.montant):'']),'Aucune action enregistrée.')}
  <h3>Détail des actions dans l’application</h3>
  ${tbl([['Date & heure'],['Qui'],['Action'],['Détail'],['Montant','n']],(db.journal||[]).slice().reverse().slice(0,200).map(e=>[`${fmtDate(String(e.t).slice(0,10))} ${String(e.t).slice(11,16)}`,esc(nomU(e.u)||'—'),JLBL[e.a]||esc(e.a),esc(e.d),e.m?fcfa(e.m):'']),'—')}`;
}
A.auditReload=async()=>{await refreshAudit();render();};
/* --- Modifier plusieurs baux en une fois (Super admin) --- */
A.bauxMasse=()=>{
  const L=BAUX().filter(b=>!b.fin).sort((a,b)=>logNom(a.logementId).localeCompare(logNom(b.logementId)));
  if(!L.length)return toast('Aucun locataire en place.');
  modal('Modifier plusieurs baux',
    `<p class="muted small">Cochez les locataires concernés. Laissez un champ vide pour ne pas le changer.</p>
    <div class="masse-list"><label class="chk"><input type="checkbox" id="mxAll" checked> <b>Tout cocher</b></label>${L.map(b=>`<label class="chk"><input type="checkbox" name="b_${b.id}" class="mxB" checked> ${esc(bailNom(b))} <span class="muted small">— ${esc(logNom(b.logementId))} · entrée ${fmtDate(b.debut)} · échéance le ${b.jour}</span></label>`).join('')}</div>`+
    `<div class="grid2">${fld('Nouvelle date d’entrée','debut','','date',false)}${num('Jour d’échéance (1 à 31)','jour','',false)}</div>`+
    `<h4>💰 Mois déjà payés</h4><label class="chk"><input type="checkbox" name="payer"> Marquer des mois comme payés (un reçu par locataire)</label>
    <div class="grid2">${fld('Du mois','du','','month',false)}${fld('Au mois','au','','month',false)}</div>`+
    sel('Mode de paiement','mode',MODES,'Espèces')+fld('Référence','ref','Régularisation','text',false),
    d=>{
      const ids=L.filter(b=>d['b_'+b.id]).map(b=>b.id);
      if(!ids.length)fail('Cochez au moins un locataire');
      const jour=d.jour===''?null:Number(d.jour);
      if(jour!==null&&!(jour>=1&&jour<=31))fail('Le jour d’échéance doit être entre 1 et 31');
      if(d.payer){if(!d.du||!d.au)fail('Indiquez les mois payés (du… au…)');if(d.au<d.du)fail('Le mois de fin est avant le mois de début');}
      let nRecus=0,tot=0;
      ids.forEach(id=>{
        const b=db.baux.find(x=>x.id===id),av={debut:b.debut,jour:b.jour};
        if(d.debut){b.debut=d.debut;if(b.finPrevue&&b.finPrevue<=d.debut)b.finPrevue=plusUnAn(d.debut);}
        if(jour!==null)b.jour=jour;
        if(d.debut||jour!==null)log('bail',`Bail de ${bailNom(b)} (${logNom(b.logementId)}) : entrée ${fmtDate(av.debut)} → ${fmtDate(b.debut)}, échéance le ${av.jour} → ${b.jour}`,0,b.id);
        if(d.payer){
          PIDX=null;
          const lignes=[];
          for(let m=d.du<b.debut.slice(0,7)?b.debut.slice(0,7):d.du;m<=d.au;m=shift(m,1)){const r=Math.max(0,montantDu(b,m)-payeBail(b.id,m));if(r>0)lignes.push({m,amt:r});}
          if(lignes.length){enregistrer(b,lignes,{date:(d.debut||today()),mode:d.mode,ref:d.ref.trim()});nRecus++;tot+=sum(lignes,l=>l.amt);}
        }
      });
      PIDX=null;
      setTimeout(()=>toast(`✅ ${ids.length} bail(s) mis à jour${nRecus?` · ${nRecus} reçu(s) créés (${fcfa(tot)})`:''}`),80);
    },'Appliquer');
  const all=document.getElementById('mxAll');if(all)all.addEventListener('change',()=>document.querySelectorAll('.mxB').forEach(c=>c.checked=all.checked));
};

/* ---------- Écouteurs ---------- */
document.addEventListener('click',e=>{
  const lg=e.target.closest('a[data-log]');
  if(lg){const [bid,type]=lg.dataset.log.split('|');logRelance(bid,type);return;}
  const el=e.target.closest('[data-a]');
  if(el){const n=el.dataset.a,fn=A[n];if(fn){e.preventDefault();if(ADMIN_ONLY.has(n)&&!isAdmin()){toast('🔒 Réservé au Super admin');return;}if(n!=='lbClose'&&!['lockUser','lockMode'].includes(n)&&(compromis()||!connecte())&&!document.getElementById('lock').contains(el))return;fn(el.dataset.id);}return;}
  chartTip(e);
});
document.addEventListener('pointerover',chartTip);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('input',e=>{
  if(e.target.name==='montant'&&ENC&&document.getElementById('plan'))majPlan(e.target.value);
  if(e.target.closest&&e.target.closest('.inc-cout'))majIncTot();
  if(e.target.id==='search'){state.search=e.target.value;const l=document.getElementById('liste');if(l)l.innerHTML=listeLocataires();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='mois'&&e.target.value){state.mois=e.target.value;state.moisAuto=state.mois===moisLoyer();render();}
  if(e.target.id==='immSel'){state.imm=e.target.value;render();}
  if(e.target.name==='terme'&&e.target.checked){db.settings.terme=e.target.value;log('parametres','Mois du loyer : '+(e.target.value==='echu'?'mois écoulé':'mois en cours'));save();state.moisAuto=true;render();toast('Le loyer à encaisser est maintenant celui '+deM(moisLoyer()));}
  if(e.target.id==='ecoMode'){try{localStorage.setItem('gestimmo_eco',e.target.checked?'1':'0');}catch(_){}toast(e.target.checked?'Mode économie de données activé':'Mode normal');}
  if(e.target.id==='autoRecu'){db.settings.autoRecu=e.target.checked;save();toast(e.target.checked?'Reçu automatique activé':'Reçu automatique désactivé');}
  if(e.target.id==='importFile'&&e.target.files[0]){if(isAdmin()||compromis())importFile(e.target.files[0]);else toast('🔒 Réservé au Super admin');}
  if(e.target.id==='jfSel'){state.jf=e.target.value;render();}
  if(e.target.id==='logoFile'&&e.target.files[0]&&isAdmin())setLogo(e.target.files[0]);
  if(e.target.classList.contains('pjFile')&&e.target.files.length){addPJ([...e.target.files],e.target.dataset.type);e.target.value='';}
  if(e.target.closest&&e.target.closest('#mForm')&&document.getElementById('incTot'))majIncTot();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='lockForm')return;
  e.preventDefault();
  if(CLOUD){cloudSubmit();return;}
  if(compromis())return;
  if(comptes()){if(LOGIN.mode==='secours')secours(document.getElementById('recIn').value,document.getElementById('newPw').value);else connexion(document.getElementById('loginIn')?.value,document.getElementById('pinIn')?.value);return;}
  const i=document.getElementById('pinIn');
  if(hashPin(i.value)===db.settings.pin){state.unlocked=true;i.value='';saveUi();checkLock();}
  else{i.value='';toast('Code incorrect');}
});
window.addEventListener('scroll',()=>document.getElementById('ctip').classList.add('hidden'),{passive:true});

render();
if(CLOUD)cloudInit();
</script>
