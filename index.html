.doc-brand{display:flex;gap:12px;align-items:center;font-size:13px;color:#4b5563;margin:6px 0}.doc-brand img{max-height:56px;max-width:110px;border-radius:6px;background:#fff}.doc-brand b{color:#0f4c3a;font-size:15px}

}

  nav{position:fixed;top:52px;left:0;bottom:0;width:220px;flex-direction:column;overflow-y:auto;border-right:1px solid #e5e7eb;border-bottom:0;padding:12px 0}
  nav button{text-align:left;border-bottom:0;border-left:3px solid transparent;padding:12px 20px;font-size:15px}

<body>
<script type="application/json" id="data">{}</script>
<script>
/* ===== GestImmo v2 — gestion locative ===== */
const SCRIPT=document.currentScript.textContent;
const STYLE=document.querySelector('style').textContent;
const NAV=[['dash','🏠','Accueil'],['immeubles','🏢','Immeubles'],['locataires','👥','Locataires'],['loyers','💰','Loyers'],['relances','📣','Relances'],['depenses','🧾','Dépenses'],['incidents','🛠️','Réparations'],['rapports','📊','Rapports'],['parametres','⚙️','Paramètres']];
document.body.insertAdjacentHTML('afterbegin',`<header class="top"><b class="brand">🏢 GestImmo</b><div class="topr"><select id="immSel" aria-label="Immeuble"></select><button class="ghost sm hidden" id="lockBtn" data-a="lock" title="Verrouiller">🔒</button></div></header>
<nav>${NAV.map(n=>`<button data-a="goto" data-id="${n[0]}">${n[1]} ${n[2]}</button>`).join('')}</nav>
<main id="app"></main>
<div id="toast" class="toast hidden"></div>
<div id="ctip" class="ctip hidden"></div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-head"><h3 id="mTitle" style="margin:0"></h3><button type="button" class="ghost sm" data-a="closeModal">✕</button></div><form id="mForm" autocomplete="off"></form></div></div>
<div id="lb" class="lb hidden" data-a="lbClose"><img id="lbImg" alt=""><div id="lbCap"></div></div><div id="lock" class="lock hidden"><form id="lockForm" class="lockbox"><h2>🔒 GestImmo</h2><p class="muted">Entrez votre code PIN</p><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8"><button class="primary" style="width:100%;margin-top:12px">Déverrouiller</button></form></div>`);

const KEY='gestimmo_v1';
const CATS=['Électricité','Eau','Gardiennage','Entretien / réparations','Travaux','Taxes / impôts','Assurance','Frais de gestion','Autre'];
const MODES=['Espèces','Orange Money','MTN MoMo','Wave','Moov Money','Virement bancaire','Chèque'];
const TYPES=['Studio','Chambre salon','2 chambres salon','3 chambres salon','4 chambres salon','Villa','Magasin','Bureau','Autre'];
const OLD_TYPES={F1:'Studio',F2:'Chambre salon',F3:'2 chambres salon',F4:'3 chambres salon',F5:'4 chambres salon','Local commercial':'Magasin'};
const PRIOS=['Basse','Normale','Urgente'];
const STATS=['Ouvert','En cours','Résolu'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const LBL={paye:'Payé',partiel:'Partiel',retard:'En retard',attente:'À venir',accord:'Reste promis'};
const BCLS={paye:'ok',partiel:'warn',retard:'neg',attente:'',accord:'warn'};
const C_ATT='#2a78d6',C_ENC='#eb6834';

/* ---------- Outils ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa=n=>Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' FCFA';
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function curMois(){return today().slice(0,7);}
function shift(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
const fmtDate=iso=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`;};
const moisLabel=ym=>{const [y,m]=ym.split('-');return MOIS[m-1]+' '+y;};
const deM=ym=>{const l=moisLabel(ym);return (/^[aeiouo]/.test(l)?'d’':'de ')+l;};
const jours=iso=>Math.round((new Date(iso+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
function plusUnAn(iso){const d=new Date(iso+'T00:00:00');d.setFullYear(d.getFullYear()+1);d.setDate(d.getDate()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fail(m){throw new Error(m);}
function waLink(tel,msg){let n=String(tel||'').replace(/\D/g,'');if(n.length===10&&n.startsWith('0'))n='225'+n;return `https://wa.me/${n}?text=${encodeURIComponent(msg)}`;}
function hashPin(p){let h=2166136261;for(const c of 'gestimmo:'+p){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}
function compact(v){if(v>=1e6)return (v/1e6).toFixed(v%1e6?1:0).replace('.',',')+' M';if(v>=1e3)return Math.round(v/1e3)+' k';return String(Math.round(v));}
function niceMax(v){const p=10**Math.floor(Math.log10(v));const n=v/p;return (n<=1?1:n<=2?2:n<=4?4:n<=5?5:n<=8?8:10)*p;}

/* ---------- Données & enregistrement ---------- */
function emptyDb(){return {immeubles:[],logements:[],locataires:[],baux:[],paiements:[],depenses:[],incidents:[],settings:{pin:'',seq:0}};}
function migrate(d){
  if(d.immeuble&&!(d.immeubles&&d.immeubles.length)){
    if(d.immeuble.nom||(d.logements||[]).length){
      d.immeubles=[{id:'i1',nom:d.immeuble.nom||'Mon immeuble',adresse:d.immeuble.adresse||'',proprietaire:d.immeuble.proprietaire||'',contact:d.immeuble.contact||''}];
      (d.logements||[]).forEach(l=>l.immeubleId=l.immeubleId||'i1');
      (d.depenses||[]).forEach(x=>x.immeubleId=x.immeubleId||'i1');
    }
  }
  delete d.immeuble;
  (d.logements||[]).forEach(l=>{if(OLD_TYPES[l.type])l.type=OLD_TYPES[l.type];});
  const e=emptyDb();
  return {...e,...d,settings:{...e.settings,...(d.settings||{})}};
}
function load(){
  let emb=null,loc=null;
  try{const t=document.getElementById('data').textContent.trim();if(t&&t!=='{}')emb=JSON.parse(t);}catch(e){}
  try{loc=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  const best=[emb,loc].filter(Boolean).sort((a,b)=>(b._ts||0)-(a._ts||0))[0];
  return best?migrate(best):emptyDb();
}
let ART=null,DL=null,pubTimer=null,readOnly=false,PIDX=null,CHART=[];
(async()=>{try{if(window.claude&&window.claude.use){ART=await window.claude.use('artifact');DL=await window.claude.use('downloads');}}catch(e){}})();
function saveUi(){try{sessionStorage.setItem(KEY+'_ui',JSON.stringify({page:state.page,mois:state.mois,id:state.id,imm:state.imm,annee:state.annee,incF:state.incF,unlocked:state.unlocked}));}catch(e){}}
function save(){
  PIDX=null;
  db._ts=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){if(!ART)toast('⚠️ Mémoire de l’appareil pleine : exportez une sauvegarde puis retirez des photos anciennes.');}
  if(ART&&!readOnly){clearTimeout(pubTimer);pubTimer=setTimeout(publishNow,1200);}
}
async function publishNow(){
  if(!document.getElementById('modal').classList.contains('hidden')){pubTimer=setTimeout(publishNow,1500);return;}
  saveUi();
  const json=JSON.stringify(db).replace(/</g,'\\u003c');
  const html=`<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f4c3a">
<title>GestImmo — Gestion locative</title>
<style>${STYLE}</style>
</head>
<body>
<script type="application/json" id="data">${json}<\/script>
<script>${SCRIPT}<\/script>
</body>
</html>`;
  try{await ART.publish(html);}
  catch(e){
    const c=String((e&&(e.code||e.message))||'');
    if(/not_granted|not_writer/.test(c)){readOnly=true;toast('Lecture seule : vos modifications restent sur cet appareil.');}
    else if(!/conflict/.test(c))toast('Synchronisation impossible : données gardées sur cet appareil.');
  }
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('hidden'),3500);}
function ask(msg){
  return new Promise(res=>{
    document.getElementById('mTitle').textContent='Confirmation';
    const f=document.getElementById('mForm');
    f.innerHTML=`<p>${esc(msg)}</p><div class="actions"><button type="button" class="ghost" id="askNo">Annuler</button><button type="button" class="danger" id="askYes">Confirmer</button></div>`;
    f.onsubmit=e=>e.preventDefault();
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('askNo').onclick=()=>{closeModal();res(false);};
    document.getElementById('askYes').onclick=()=>{closeModal();res(true);};
  });
}
async function saveFile(name,data,type){
  if(DL){try{await DL.save({filename:name,data});toast('Fichier enregistré ✅');}catch(e){toast('Téléchargement annulé');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();}catch(e){toast('Téléchargement indisponible ici');}
}

let db=load();
let state={page:'dash',mois:curMois(),search:'',id:null,imm:'all',annee:curMois().slice(0,4),incF:'ouverts',unlocked:false};
try{const u=JSON.parse(sessionStorage.getItem(KEY+'_ui'));if(u)Object.assign(state,u);sessionStorage.removeItem(KEY+'_ui');}catch(e){}

/* ---------- Requêtes métier ---------- */
const imm=id=>db.immeubles.find(x=>x.id===id);
const logement=id=>db.logements.find(x=>x.id===id);
const locataire=id=>db.locataires.find(x=>x.id===id);
const bailNom=b=>locataire(b?.locataireId)?.nom||'—';
const logNom=id=>logement(id)?.nom||'—';
const bailLogement=lid=>db.baux.find(b=>b.logementId===lid&&!b.fin);
const bailActif=(b,ym)=>b.debut.slice(0,7)<=ym&&(!b.fin||b.fin.slice(0,7)>=ym);
const inImm=lid=>state.imm==='all'||logement(lid)?.immeubleId===state.imm;
const LOGS=()=>db.logements.filter(l=>state.imm==='all'||l.immeubleId===state.imm);
const BAUX=()=>db.baux.filter(b=>inImm(b.logementId));
const DEPS=()=>db.depenses.filter(d=>state.imm==='all'||d.immeubleId===state.imm);
const INCS=()=>db.incidents.filter(i=>inImm(i.logementId));
const PAYS=()=>{const ids=new Set(BAUX().map(b=>b.id));return db.paiements.filter(p=>ids.has(p.bailId));};
function montantDu(b,ym){let l=b.loyer,c=b.charges||0;(b.revisions||[]).forEach(r=>{if(!ym||r.depuis<=ym){l=r.loyer;c=r.charges;}});return Number(l)+Number(c||0);}
function idx(){if(PIDX)return PIDX;PIDX=new Map();for(const p of db.paiements){const k=p.bailId+'|'+p.mois;PIDX.set(k,(PIDX.get(k)||0)+p.montant);}return PIDX;}
const payeBail=(id,ym)=>idx().get(id+'|'+ym)||0;
const echu=(b,ym)=>{const cur=curMois();return ym<cur||(ym===cur&&new Date().getDate()>Number(b.jour||5));};
/* Accords de paiement : le locataire paie une partie et promet le reste pour une date */
const accordDate=(b,ym)=>(b.accords||{})[ym]||'';
const accordActif=(b,ym)=>{const d=accordDate(b,ym);return !!d&&today()<=d&&payeBail(b.id,ym)<montantDu(b,ym);};
function statutBail(b,ym){
  const du=montantDu(b,ym),p=payeBail(b.id,ym),reste=Math.max(0,du-p),acc=accordDate(b,ym);
  let statut=reste===0?'paye':p>0?'partiel':echu(b,ym)?'retard':'attente';
  if(reste>0&&acc)statut=today()<=acc?'accord':'retard';
  return {du,p,reste,statut,accord:acc};
}
const statutBadge=s=>s.statut==='accord'?`<span class="badge warn">⏳ Reste promis le ${fmtDate(s.accord)}</span>`:(s.statut==='retard'&&s.accord?`<span class="badge neg">Promesse non tenue (${fmtDate(s.accord)})</span>`:badge(s.statut));
function accords(B){
  const out=[];
  B.forEach(b=>Object.entries(b.accords||{}).forEach(([m,d])=>{const r=Math.max(0,montantDu(b,m)-payeBail(b.id,m));if(r>0)out.push({b,m,d,r,ok:today()<=d});}));
  return out.sort((x,y)=>x.d.localeCompare(y.d));
}
function moisImpayes(b){
  const cur=curMois(),end=b.fin&&b.fin.slice(0,7)<cur?b.fin.slice(0,7):cur,out=[];
  for(let m=b.debut.slice(0,7);m<=end;m=shift(m,1)){
    if(echu(b,m)&&!accordActif(b,m)){const r=Math.max(0,montantDu(b,m)-payeBail(b.id,m));if(r>0)out.push({m,r});}
  }
  return out;
}
function arrieres(b){const l=moisImpayes(b);return {tot:sum(l,x=>x.r),n:l.length,list:l};}
const attenduMois=ym=>sum(BAUX().filter(b=>bailActif(b,ym)),b=>montantDu(b,ym));
const encaisseMois=ym=>sum(PAYS().filter(p=>p.mois===ym),p=>p.montant);
const impayeMois=ym=>sum(BAUX().filter(b=>bailActif(b,ym)&&echu(b,ym)&&!accordActif(b,ym)),b=>statutBail(b,ym).reste);
const depMois=ym=>sum(DEPS().filter(d=>d.date.slice(0,7)===ym),d=>d.montant);
function nextNum(){db.settings.seq=(db.settings.seq||0)+1;return `${today().slice(0,4)}-${String(db.settings.seq).padStart(4,'0')}`;}

const badge=s=>`<span class="badge ${BCLS[s]}">${LBL[s]}</span>`;
const kpi=(t,v,sub='',c='')=>`<div class="kpi"><div class="muted">${t}</div><div class="kv ${c}">${v}</div>${sub?`<div class="muted small">${sub}</div>`:''}</div>`;

}
const fld=(label,name,val='',type='text',req=true,extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(val)}" ${req?'required':''} ${extra}></label>`;
const num=(label,name,val='',req=true)=>fld(label,name,val,'number',req,'min="0" step="1" inputmode="numeric"');
const sel=(label,name,opts,val='')=>`<label>${label}<select name="${name}">${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`;}).join('')}</select></label>`;

function chart12(ymEnd){
  const ms=[...Array(12)].map((_,i)=>shift(ymEnd,i-11));
  const d=ms.map(m=>({m,a:attenduMois(m),e:encaisseMois(m)}));
  CHART=d;
  const max=niceMax(Math.max(1,...d.map(x=>Math.max(x.a,x.e))));
  const W=720,H=230,pl=50,pr=6,pt=10,pb=24,ih=H-pt-pb,cw=(W-pl-pr)/12,bw=Math.max(4,Math.min(16,(cw-12)/2));
  const Y=v=>pt+ih*(1-v/max);
  const bar=(x,v,c)=>{const h=ih*v/max;if(h<0.5)return '';const r=Math.min(4,h,bw/2),yt=pt+ih-h,yb=pt+ih;return `<path d="M${x},${yb}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+bw-r}Q${x+bw},${yt} ${x+bw},${yt+r}V${yb}Z" fill="${c}"/>`;};
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${k?'#eef0f2':'#d1d5db'}"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${compact(v)}</text>`;}
  d.forEach((x,i)=>{
    const cx=pl+i*cw,x0=cx+(cw-(2*bw+2))/2;
    g+=`<rect class="hit" data-i="${i}" x="${cx}" y="${pt}" width="${cw}" height="${ih}" fill="transparent"/>`;
    g+=bar(x0,x.a,C_ATT)+bar(x0+bw+2,x.e,C_ENC);
    g+=`<text x="${cx+cw/2}" y="${H-6}" text-anchor="middle" class="ax">${MOIS_C[+x.m.slice(5)-1]}</text>`;
  });
  return `<div class="legend"><span><i style="background:${C_ATT}"></i>Attendu</span><span><i style="background:${C_ENC}"></i>Encaissé</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Loyers attendus et encaissés sur 12 mois">${g}</svg>
  <p class="muted small">Touchez ou survolez un mois pour le détail. Tableau complet dans Rapports.</p>`;
}
let tipOn=null;
function chartTip(e){
  const h=e.target.closest&&e.target.closest('.hit'),tip=document.getElementById('ctip');
  if(tipOn&&tipOn!==h){tipOn.classList.remove('on');tipOn=null;}
  if(!h){tip.classList.add('hidden');return;}
  const x=CHART[+h.dataset.i];if(!x)return;
  h.classList.add('on');tipOn=h;
  tip.innerHTML=`<b>${moisLabel(x.m)}</b><br><i style="background:${C_ATT}"></i>Attendu : ${fcfa(x.a)}<br><i style="background:${C_ENC}"></i>Encaissé : ${fcfa(x.e)}<br>Taux : ${x.a?Math.round(Math.min(x.e,x.a)/x.a*100):0} %`;
  tip.classList.remove('hidden');
  const r=h.getBoundingClientRect();
  tip.style.left=Math.min(window.innerWidth-200,Math.max(8,r.left+r.width/2-95))+'px';
  tip.style.top=Math.max(60,r.top-tip.offsetHeight-6)+'px';
}

function modal(title,body,onOk,okLabel='Enregistrer'){
  document.getElementById('mTitle').textContent=title;
  const f=document.getElementById('mForm');
  f.innerHTML=body+(onOk?`<div class="actions"><button type="button" class="ghost" data-a="closeModal">Annuler</button><button class="primary">${okLabel}</button></div>`:'');
  f.onsubmit=e=>{
    e.preventDefault();
    if(!onOk)return;
    try{const fd=new FormData(f);const r=onOk(Object.fromEntries(fd),fd);if(r!==false){closeModal();save();render();}}
    catch(err){toast(err.message);}
  };
  document.getElementById('modal').classList.remove('hidden');
}

function pageDash(){
  if(!db.logements.length)return `<div class="card hero"><h2>Bienvenue sur GestImmo 👋</h2><p>Ajoutez votre immeuble et ses logements, puis enregistrez locataires, entrées, loyers, dépenses et incidents. Tout se calcule automatiquement.</p><div class="btns"><button data-a="addImmeuble">Ajouter un immeuble</button><button class="ghost" data-a="demo">Voir une démo</button></div></div>`;
  const ym=state.mois,L=LOGS(),B=BAUX();

  accKo.forEach(x=>al.push(['neg','❌',`Promesse non tenue : ${bailNom(x.b)} devait payer ${fcfa(x.r)} (reste ${deM(x.m)}) le ${fmtDate(x.d)}`]));

  const vac=L.filter(l=>!bailLogement(l.id));

  const mv=B.filter(b=>b.debut.slice(0,7)===ym||(b.fin&&b.fin.slice(0,7)===ym));

  <div class="grid kpis6">
    ${kpi('Occupation',`${occ}/${n}`,`${taux} % occupé`)}

    ${kpi('Encaissé',fcfa(enc),`Recouvrement ${rec} %`,'ok')}
    ${kpi('Impayés du mois',fcfa(imp),`${rel.length} locataire(s)`,imp>0?'neg':'ok')}
    ${kpi('Dépenses',fcfa(dep))}
    ${kpi('Solde net',fcfa(solde),'Encaissé − dépenses',solde>=0?'ok':'neg')}
  </div>
  <div class="cols2">
    <div class="card"><h3 style="margin:0">Loyers sur 12 mois</h3>${chart12(ym)}</div>

  </div>
  <div class="cols2">
    <div><h3>À relancer — ${moisLabel(ym)}</h3>

    ${kpi('Total payé',fcfa(sum(pays,p=>p.montant)),`${recus(pays).length} reçu(s)`)}
    ${kpi('Loyer actuel',actif?fcfa(montantDu(actif,curMois())):'—',actif?`Échéance le ${actif.jour} du mois`:'')}

function pageLoyers(){

  return `${monthNav()}
  <div class="grid">${kpi('Attendu',fcfa(att))}${kpi('Loyers du mois payés',fcfa(enc),'','ok')}${kpi('Reste à percevoir',fcfa(reste),`Recouvrement ${att?Math.round(Math.min(enc,att)/att*100):0} %`,reste?'neg':'ok')}</div>

    return [esc(logNom(b.logementId)),`<button class="linkbtn" data-a="fiche" data-id="${b.locataireId}">${esc(t?.nom)}</button>`,fcfa(s.du),fcfa(s.p),`<span class="${s.reste?(s.statut==='accord'?'':'neg'):'ok'}">${fcfa(s.reste)}</span>`,statutBadge(s),b.fin?'<span class="badge">Parti</span>':jusquaBadge(b),
      `${s.reste&&t?.tel&&s.statut!=='attente'?`<a class="btn wa sm" href="${esc(waLink(t.tel,msg))}" target="_blank" rel="noopener">${s.statut==='accord'?'Rappel':'Relancer'}</a>`:''}${b.fin?'':`<button class="sm ${s.reste?'primary':'ghost'}" data-a="encaisser" data-id="${b.id}">${s.reste?'Encaisser':'+ Avance'}</button>`}`];

  ${tbl([['Reçu N°'],['Date'],['Locataire'],['Période payée'],['Montant','n'],['Mode'],['','act']],recuRows(rc,true),'Aucun reçu émis ce mois.')}`;

function bilan(y){
  return [...Array(12)].map((_,i)=>{const m=`${y}-${String(i+1).padStart(2,'0')}`;const a=attenduMois(m),e=encaisseMois(m),im=impayeMois(m),dp=depMois(m);return {m,a,e,im,dp,net:e-dp};});
}
function situation(){
  return BAUX().map(b=>({b,a:arrieres(b)})).filter(x=>!x.b.fin||x.a.tot>0).sort((a,b)=>b.a.tot-a.a.tot);
}

  <div class="grid kpis6">${kpi('Loyers attendus',fcfa(T('a')))}${kpi('Encaissé',fcfa(T('e')),'','ok')}${kpi('Taux de recouvrement',rec+' %')}${kpi('Impayés',fcfa(T('im')),'',T('im')?'neg':'ok')}${kpi('Dépenses',fcfa(T('dp')))}${kpi('Résultat net',fcfa(T('net')),'',T('net')>=0?'ok':'neg')}</div>
  <div class="row"><h3>Bilan mensuel ${y}</h3><div class="btns" style="margin:0"><button class="sm ghost" data-a="csvBilan">⬇ Export Excel</button><button class="sm ghost" data-a="dlRapport">⬇ Rapport imprimable</button></div></div>
  ${tbl([['Mois'],['Attendu','n'],['Encaissé','n'],['Impayés','n'],['Dépenses','n'],['Net','n']],rows.map(r=>[moisLabel(r.m),fcfa(r.a),fcfa(r.e),r.im?`<span class="neg">${fcfa(r.im)}</span>`:fcfa(0),fcfa(r.dp),`<span class="${r.net>=0?'ok':'neg'}">${fcfa(r.net)}</span>`]),'',
    ['Total',fcfa(T('a')),fcfa(T('e')),fcfa(T('im')),fcfa(T('dp')),fcfa(T('net'))])}
  <div class="row"><h3>Situation des locataires</h3><button class="sm ghost" data-a="csvSituation">⬇ Export Excel</button></div>
  ${releveSection()}
  ${tbl([['Locataire'],['Logement'],['Loyer','n'],['Mois impayés','n'],['Arriérés','n'],['Caution','n']],sit.map(({b,a})=>[`<button class="linkbtn" data-a="fiche" data-id="${b.locataireId}">${esc(bailNom(b))}</button>${b.fin?' <span class="badge">Parti</span>':''}`,esc(logNom(b.logementId)),fcfa(montantDu(b,curMois())),String(a.n),a.tot?`<span class="neg">${fcfa(a.tot)}</span>`:'<span class="ok">À jour</span>',fcfa(b.caution)]),'Aucun locataire.')}`;
}

const PAGES={dash:pageDash,immeubles:pageImmeubles,locataires:pageLocataires,fiche:pageFiche,loyers:pageLoyers,depenses:pageDepenses,incidents:pageIncidents,rapports:pageRapports,parametres:pageParametres,relances:pageRelances};
function render(){
  PIDX=null;
  if(state.imm!=='all'&&!imm(state.imm))state.imm='all';
  const s=document.getElementById('immSel');
  s.innerHTML=`<option value="all">Tous les immeubles</option>`+db.immeubles.map(i=>`<option value="${i.id}" ${i.id===state.imm?'selected':''}>${esc(i.nom)}</option>`).join('');
  s.classList.toggle('hidden',db.immeubles.length<2);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===(state.page==='fiche'?'locataires':state.page)));
  const nr=db.logements.length?aRelancer().filter(r=>r.type!=='avant').length:0,nb=document.querySelector('nav [data-id=relances]');
  if(nb)nb.innerHTML=`📣 Relances${nr?` <span class="nb">${nr}</span>`:''}`;
  const br=document.querySelector('.brand');if(br)br.innerHTML=AG().logo?`<img src="${AG().logo}" class="brand-logo" alt=""> ${esc(AG().nom||'GestImmo')}`:`🏢 ${esc(AG().nom||'GestImmo')}`;
  document.getElementById('ctip').classList.add('hidden');
  document.getElementById('app').innerHTML=(PAGES[state.page]||pageDash)();
  checkLock();
}
function checkLock(){
  document.getElementById('lockBtn').classList.toggle('hidden',!db.settings.pin);
  const L=document.getElementById('lock');
  if(db.settings.pin&&!state.unlocked){L.classList.remove('hidden');setTimeout(()=>document.getElementById('pinIn').focus(),50);}
  else L.classList.add('hidden');
}

/* ---------- Actions ---------- */
const A={};
A.goto=id=>{state.page=id;render();window.scrollTo(0,0);};
A.fiche=id=>{state.page='fiche';state.id=id;render();window.scrollTo(0,0);};
A.mois=n=>{state.mois=shift(state.mois,Number(n));render();};
A.annee=n=>{state.annee=String(Number(state.annee)+Number(n));render();};
A.incF=v=>{state.incF=v;render();};
A.closeModal=closeModal;
A.lock=()=>{state.unlocked=false;saveUi();checkLock();};

const immData=d=>{if(!d.nom.trim())fail('Le nom de l’immeuble est requis');return {nom:d.nom.trim(),adresse:d.adresse.trim(),proprietaire:d.proprietaire.trim(),contact:d.contact.trim()};};
A.addImmeuble=()=>modal('Nouvel immeuble',fImm(),d=>{const id=uid();db.immeubles.push({id,...immData(d)});if(db.immeubles.length>1)state.imm=id;state.page='immeubles';});
A.editImmeuble=id=>{const i=imm(id);modal('Modifier l’immeuble',fImm(i),d=>{Object.assign(i,immData(d));});};
A.delImmeuble=async id=>{
  if(db.logements.some(l=>l.immeubleId===id))return toast('Supprimez d’abord les logements de cet immeuble.');
  if(!await ask(`Supprimer l’immeuble ${imm(id).nom} ?`))return;
  db.immeubles=db.immeubles.filter(x=>x.id!==id);save();render();
};

const logData=(d,id)=>{
  if(!d.immeubleId)fail('Choisissez un immeuble');
  if(!d.nom.trim())fail('Le nom du logement est requis');
  if(!(Number(d.loyer)>0))fail('Le loyer doit être supérieur à 0');

/* ---------- Paiements intelligents : arriérés d'abord, puis mois en cours, puis avance ---------- */
const MAX_AVANCE=36;
function planPaiement(b,montant){
  const out=[],cur=curMois(),lim=shift(cur,MAX_AVANCE),fin=b.fin?b.fin.slice(0,7):null;
  let left=montant;
  for(let m=b.debut.slice(0,7);left>0&&m<=lim&&(!fin||m<=fin);m=shift(m,1)){
    const du=montantDu(b,m),r=Math.max(0,du-payeBail(b.id,m));
    if(r>0){const a=Math.min(r,left);out.push({m,amt:a,du,reste:r-a});left-=a;}
  }
  return {lignes:out,surplus:left};
}
/* Montant nécessaire pour être à jour jusqu'au mois ym inclus */
function montantJusqua(b,ym){let s=0;for(let m=b.debut.slice(0,7);m<=ym;m=shift(m,1))s+=Math.max(0,montantDu(b,m)-payeBail(b.id,m));return s;}
/* Dernier mois entièrement payé sans trou depuis l'entrée */
function payeJusqua(b){
  let last=null;const lim=shift(curMois(),MAX_AVANCE+1),fin=b.fin?b.fin.slice(0,7):null;
  for(let m=b.debut.slice(0,7);m<=lim&&(!fin||m<=fin);m=shift(m,1)){
    if(payeBail(b.id,m)>=montantDu(b,m))last=m;else break;
  }
  return last;
}
function avance(b){const cur=curMois(),j=payeJusqua(b);if(!j||j<=cur)return {n:0,tot:0};let n=0,tot=0;for(let m=shift(cur,1);m<=j;m=shift(m,1)){n++;tot+=montantDu(b,m);}return {n,tot};}
function jusquaBadge(b){
  const j=payeJusqua(b),cur=curMois();
  if(!j)return '<span class="badge neg">Aucun mois soldé</span>';
  if(j>cur)return `<span class="badge ok">✓ Avance jusqu’à ${moisLabel(j)}</span>`;
  if(j===cur)return `<span class="badge ok">À jour (${moisLabel(j)})</span>`;
  const nx=shift(j,1);
  return `<span class="badge ${echu(b,nx)&&!accordActif(b,nx)?'neg':'warn'}">Payé jusqu’à ${moisLabel(j)}</span>`;
}
function enregistrer(b,lignes,info){
  const rid=uid(),num=nextNum();
  lignes.forEach(l=>db.paiements.push({id:uid(),bailId:b.id,mois:l.m,montant:l.amt,date:info.date,mode:info.mode,ref:info.ref||'',num,recu:rid}));
  PIDX=null;
  return rid;
}
function planHtml(b,montant){
  if(!(montant>0))return '<p class="muted small">Saisissez un montant.</p>';
  const {lignes,surplus}=planPaiement(b,montant);
  const last=lignes[lignes.length-1];
  const vis=lignes.length>7?[...lignes.slice(0,3),null,...lignes.slice(-3)]:lignes;
  return `<div class="plan"><b>Répartition automatique (${lignes.length} mois) :</b>${vis.map(l=>!l?'<div class="muted small">…</div>':`<div class="row"><span>${moisLabel(l.m)}${l.m>curMois()?' <span class="badge ok">avance</span>':l.m<curMois()?' <span class="badge neg">arriéré</span>':''}</span><span>${fcfa(l.amt)}${l.reste?` <span class="muted small">(reste ${fcfa(l.reste)})</span>`:''}</span></div>`).join('')}
  ${surplus>0?`<p class="neg small">⚠️ ${fcfa(surplus)} de trop : maximum ${MAX_AVANCE} mois d’avance${b.fin?' ou fin du bail':''}.</p>`:''}
  ${last?`<p class="ok small" style="margin:6px 0 0">${last.reste?`Le mois ${deM(last.m)} restera partiel.`:`✅ Loyer payé jusqu’à ${moisLabel(last.m)}.`}</p>`:''}</div>`;
}
let ENC=null;
A.encaisser=(bid,preset)=>{

  ENC=b;

  const q=(half?`<button type="button" class="sm ghost" data-a="qm" data-id="${half}">½ mois · ${fcfa(half)}</button>`:'')+[[0,'Mois en cours'],[2,'3 mois'],[5,'6 mois'],[11,'12 mois']].map(([k,t])=>{const ym=shift(cur,k);const v=montantJusqua(b,ym);return v>0?`<button type="button" class="sm ghost" data-a="qm" data-id="${v}">${t} · ${fcfa(v)}</button>`:'';}).join('');

    fld('Date de réception','date',today(),'date')+
    sel('Mode de paiement','mode',MODES,'Espèces')+
    fld('Référence de transaction (facultatif)','ref','','text',false),

/* Liste des reçus (paiements regroupés par transaction) */
function recus(pays){
  const g=new Map();
  pays.forEach(p=>{const k=p.recu||p.id;if(!g.has(k))g.set(k,[]);g.get(k).push(p);});
  return [...g.entries()].map(([rid,ps])=>{ps.sort((a,b)=>a.mois.localeCompare(b.mois));return {rid,ps,num:ps[0].num||'—',date:ps[0].date,mode:ps[0].mode,ref:ps[0].ref,bailId:ps[0].bailId,tot:sum(ps,x=>x.montant),de:ps[0].mois,a:ps[ps.length-1].mois};}).sort((a,b)=>b.date.localeCompare(a.date)||String(b.num).localeCompare(String(a.num)));
}
const periode=r=>r.de===r.a?moisLabel(r.de):`${moisLabel(r.de)} → ${moisLabel(r.a)}`;
function recuRows(list,avecLoc){
  return list.map(r=>{const b=db.baux.find(x=>x.id===r.bailId);return [`<b>${esc(r.num)}</b>`,fmtDate(r.date),...(avecLoc?[esc(bailNom(b))]:[]),periode(r)+(r.ps.length>1?` <span class="muted small">(${r.ps.length} mois)</span>`:''),`<span class="ok">${fcfa(r.tot)}</span>`,esc(r.mode),
    `<button class="sm" data-a="recu" data-id="${r.rid}">🧾 Reçu</button><button class="sm danger" data-a="delRecu" data-id="${r.rid}">✕</button>`];});
}

/* ---------- Reçu numérique ---------- */
function verif(rid,num,tot){let h=2166136261;for(const c of `${rid}|${num}|${tot}`){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}const s=(h>>>0).toString(36).toUpperCase().padStart(8,'0');return s.slice(0,4)+'-'+s.slice(4,8);}
function recuData(rid){
  const ps=db.paiements.filter(p=>(p.recu||p.id)===rid).sort((a,b)=>a.mois.localeCompare(b.mois));
  if(!ps.length)return null;
  const p=ps[0],b=db.baux.find(x=>x.id===p.bailId),l=logement(b.logementId),tot=sum(ps,x=>x.montant);
  return {rid,num:p.num||'—',date:p.date,mode:p.mode,ref:p.ref,b,l,t:locataire(b.locataireId),im:imm(l?.immeubleId)||{},tot,
    lignes:ps.map(x=>{const du=montantDu(b,x.mois),paye=payeBail(b.id,x.mois);return {m:x.mois,amt:x.montant,du,solde:paye>=du,reste:Math.max(0,du-paye)};}),
    jusqua:payeJusqua(b),arr:arrieres(b).tot,code:verif(rid,p.num,tot),
    promesse:(()=>{const x=ps[ps.length-1],du=montantDu(b,x.mois),r=Math.max(0,du-payeBail(b.id,x.mois)),d=accordDate(b,x.mois);return r>0&&d?{m:x.mois,r,d}:null;})()};
}

}

function recuCanvas(R){
  const W=720,pad=36,lh=34,n=R.lignes.length;
  const H=148+40+3*lh+12+n*lh+10+44+(R.promesse?30:0)+(R.jusqua?30:0)+(R.arr?30:0)+44+(AG().nom?26:0);
  const c=document.createElement('canvas');c.width=W*2;c.height=H*2;
  const g=c.getContext('2d');g.scale(2,2);
  const F=(w,s)=>`${w} ${s}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
  g.fillStyle='#ffffff';g.fillRect(0,0,W,H);
  g.fillStyle='#0f4c3a';g.fillRect(0,0,W,110);
  let hx=pad;
  if(LOGO){const s=Math.min(70/LOGO.width,70/LOGO.height),w=LOGO.width*s,h=LOGO.height*s;g.fillStyle='#ffffff';g.fillRect(pad-4,20-4,78,78);g.drawImage(LOGO,pad+(70-w)/2,20+(70-h)/2,w,h);hx=pad+90;}
  g.fillStyle='#ffffff';g.font=F(700,26);g.fillText('REÇU DE PAIEMENT',hx,50);
  g.font=F(400,17);g.fillText('N° '+R.num+'   ·   '+fmtDate(R.date),hx,82);
  g.fillStyle='#dcfce7';g.beginPath();g.roundRect?g.roundRect(W-pad-120,36,120,40,20):g.rect(W-pad-120,36,120,40);g.fill();
  g.fillStyle='#166534';g.font=F(700,17);g.textAlign='center';g.fillText('✔ PAYÉ',W-pad-60,62);g.textAlign='left';
  let y=148;
  g.fillStyle='#6b7280';g.font=F(400,16);g.fillText((R.im.nom||'')+(R.im.adresse?' — '+R.im.adresse:''),pad,y);y+=40;
  const row=(k,v,bold,color)=>{g.fillStyle='#6b7280';g.font=F(400,17);g.textAlign='left';g.fillText(k,pad,y);g.fillStyle=color||'#111827';g.font=F(bold?700:400,17);g.textAlign='right';g.fillText(v,W-pad,y);g.textAlign='left';y+=lh;};
  row('Locataire',R.t?.nom||'',true);row('Logement',R.l?.nom||'',true);row('Mode de paiement',R.mode+(R.ref?' · '+R.ref:''));
  y+=4;g.strokeStyle='#e5e7eb';g.beginPath();g.moveTo(pad,y-20);g.lineTo(W-pad,y-20);g.stroke();y+=8;
  R.lignes.forEach(x=>row('Loyer '+moisLabel(x.m),fcfa(x.amt)+(x.solde?'':' (partiel)')));
  g.beginPath();g.moveTo(pad,y-20);g.lineTo(W-pad,y-20);g.stroke();y+=10;
  g.fillStyle='#111827';g.font=F(700,22);g.fillText('Total reçu',pad,y);g.textAlign='right';g.fillText(fcfa(R.tot),W-pad,y);g.textAlign='left';y+=44;
  if(R.promesse){g.fillStyle='#92400e';g.font=F(600,17);g.fillText('🤝 Reste '+fcfa(R.promesse.r)+' à payer au plus tard le '+fmtDate(R.promesse.d),pad,y);y+=30;}
  if(R.jusqua){g.fillStyle='#15803d';g.font=F(600,18);g.fillText('✅ Loyer payé jusqu’à '+moisLabel(R.jusqua),pad,y);y+=30;}
  if(R.arr){g.fillStyle='#b91c1c';g.font=F(400,16);g.fillText('Reste dû : '+fcfa(R.arr),pad,y);y+=30;}
  g.fillStyle='#6b7280';g.font=F(400,14);g.fillText('Code de vérification : '+R.code+(R.im.proprietaire?'   ·   Le bailleur : '+R.im.proprietaire:''),pad,H-28);
  g.textAlign='right';g.fillText(AG().nom?'':'GestImmo',W-pad,H-28);g.textAlign='left';
  if(AG().nom){g.strokeStyle='#e5e7eb';g.beginPath();g.moveTo(pad,H-80);g.lineTo(W-pad,H-80);g.stroke();g.fillStyle='#0f4c3a';g.font=F(600,15);g.fillText(AG().nom+(AG().tel?'   ·   '+AG().tel:''),pad,H-28-26+0);}
  return c;
}

function pjHtml(){VIEWPJ=PJ;return PJ.length?`<div class="pj">${PJ.map((p,k)=>`<div class="pj-i"><img src="${p.data}" data-a="voirImg" data-id="${k}" alt=""><span>${PJT[p.type]||''}</span><button type="button" class="pj-x" data-a="pjDel" data-id="${k}" title="Retirer">✕</button></div>`).join('')}</div>`:'<p class="muted small">Aucune pièce jointe pour l’instant.</p>';}
function pjInputs(types,aide){return `<div class="btns">${types.map(t=>`<label class="btn sm ghost" style="position:relative;margin:0">${PJT[t]}<input type="file" accept="image/*" multiple class="hidden-input pjFile" data-type="${t}"></label>`).join('')}</div><div id="pjList">${pjHtml()}</div><p class="muted small">${aide||'Les photos sont compressées automatiquement.'}</p>`;}
function compressImg(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.6));};i.onerror=rej;i.src=r.result;};r.onerror=rej;r.readAsDataURL(f);});}
async function addPJ(files,type){for(const f of files){if(!/^image\//.test(f.type)){toast('Seules les images sont acceptées : prenez le reçu en photo');continue;}try{PJ.push({id:uid(),type,data:await compressImg(f),date:today()});}catch(e){toast('Image illisible');}}const l=document.getElementById('pjList');if(l)l.innerHTML=pjHtml();}
A.pjDel=k=>{PJ.splice(Number(k),1);document.getElementById('pjList').innerHTML=pjHtml();};
A.voirImg=k=>{const p=VIEWPJ[Number(k)];if(!p)return;document.getElementById('lbImg').src=p.data;document.getElementById('lbCap').textContent=(PJT[p.type]||'')+(p.date?' · '+fmtDate(p.date):'');document.getElementById('lb').classList.remove('hidden');};
A.lbClose=()=>document.getElementById('lb').classList.add('hidden');

const matTot=m=>(Number(m.qte)||1)*(Number(m.pu)||0);
const incMat=i=>sum(i.materiel||[],matTot);
function matRow(m={}){const id='mr'+uid();return `<div class="mat" id="${id}"><input name="art" placeholder="Article (ex : robinet)" value="${esc(m.art||'')}"><input name="qte" type="number" min="0" step="any" placeholder="Qté" value="${m.qte??1}"><input name="pu" type="number" min="0" step="1" inputmode="numeric" placeholder="Prix unitaire" value="${m.pu??''}"><input name="four" placeholder="Fournisseur / boutique" value="${esc(m.four||'')}"><button type="button" class="sm danger" data-a="matDel" data-id="${id}">✕</button></div>`;}
A.matAdd=()=>{document.getElementById('mats').insertAdjacentHTML('beforeend',matRow());majIncTot();};
A.matDel=id=>{document.getElementById(id)?.remove();majIncTot();};
function majIncTot(){
  const f=document.getElementById('mForm'),el=document.getElementById('incTot');if(!f||!el)return;
  const fd=new FormData(f),pu=fd.getAll('pu'),q=fd.getAll('qte');
  const mat=sum(pu.map((p,k)=>({pu:p,qte:q[k]})),matTot),mo=Number(fd.get('mo'))||0;
  el.innerHTML=`Matériel <b>${fcfa(mat)}</b> + Main d’œuvre <b>${fcfa(mo)}</b> = <b class="big2">${fcfa(mat+mo)}</b>`;
  const c=fd.get('charge'),rb=document.getElementById('rembBox');if(rb)rb.classList.toggle('hidden',c==='Propriétaire');
}
const fInc=(i={})=>{
  const mats=(i.materiel&&i.materiel.length)?i.materiel:(i.cout&&!i.mo?[{art:'Coût global (ancien enregistrement)',qte:1,pu:i.cout}]:[{}]);
  return sel('Logement','logementId',LOGS().map(l=>[l.id,(db.immeubles.length>1?imm(l.immeubleId)?.nom+' — ':'')+l.nom+' ('+l.type+')']),i.logementId||'')+

  `<div id="rembBox" class="${(i.charge||'Propriétaire')==='Propriétaire'?'hidden':''}"><label class="chk"><input type="checkbox" name="rembourse" ${i.rembourse?'checked':''}> Le locataire a déjà remboursé sa part</label></div>`+

  `<div id="incTot" class="plan"></div>`+
  `<h4>📎 Preuves</h4>${pjInputs(['avant','apres','facture'],'Photographiez le problème avant, le travail après, et chaque reçu d’achat de matériel ou de main d’œuvre.')}`+
  (i.depenseId?'<p class="muted small">✔ Lié aux dépenses : le montant sera mis à jour automatiquement.</p>':`<label class="chk"><input type="checkbox" name="toDep" checked> Ajouter le coût aux dépenses une fois résolu</label>`);
};
function chargeLoc(i){const c=i.cout||0;return i.charge==='Locataire'?c:i.charge==='Partagé (50/50)'?Math.round(c/2):0;}
function reparationsLoc(b){return db.incidents.filter(i=>i.logementId===b.logementId&&i.statut==='Résolu'&&!i.rembourse&&chargeLoc(i)>0&&i.date>=b.debut&&(!b.fin||i.date<=b.fin));}
function incSave(i,d,fd){
  if(!d.logementId)fail('Choisissez un logement');
  if(!d.titre.trim())fail('Décrivez le problème');
  const art=fd.getAll('art'),q=fd.getAll('qte'),pu=fd.getAll('pu'),four=fd.getAll('four');
  const materiel=art.map((a,k)=>({art:a.trim(),qte:Number(q[k])||1,pu:Number(pu[k])||0,four:(four[k]||'').trim()})).filter(m=>m.art||m.pu);
  if(materiel.some(m=>m.pu<0))fail('Prix invalide');
  const mo=Number(d.mo)||0,cout=sum(materiel,matTot)+mo;
  Object.assign(i,{logementId:d.logementId,titre:d.titre.trim(),description:d.description.trim(),date:d.date,priorite:d.priorite,statut:d.statut,
    cause:d.cause,charge:d.charge,rembourse:d.charge!=='Propriétaire'&&!!d.rembourse,materiel,mo,artisan:d.artisan.trim(),artisanTel:d.artisanTel.trim(),cout,pieces:PJ.slice()});
  if(i.statut==='Résolu'&&!i.resolu)i.resolu=today();
  if(i.statut!=='Résolu')i.resolu='';
  const dep=i.depenseId&&db.depenses.find(x=>x.id===i.depenseId);
  const lib=`Réparation : ${i.titre} (${logNom(i.logementId)})`;
  if(dep){Object.assign(dep,{montant:cout,libelle:lib,immeubleId:logement(i.logementId)?.immeubleId});if(!cout){db.depenses=db.depenses.filter(x=>x!==dep);i.depenseId='';}}
  else if(d.toDep&&i.statut==='Résolu'&&cout>0){const nd={id:uid(),immeubleId:logement(i.logementId)?.immeubleId,date:i.resolu||today(),cat:'Entretien / réparations',libelle:lib,montant:cout,incidentId:i.id,pieces:[]};db.depenses.push(nd);i.depenseId=nd.id;}
}
A.addIncident=()=>{if(!LOGS().length)return toast('Ajoutez d’abord des logements.');PJ=[];modal('Signaler une réparation',fInc(),(d,fd)=>{const i={id:uid()};incSave(i,d,fd);db.incidents.push(i);});setTimeout(majIncTot,0);};
A.editIncident=id=>{const i=db.incidents.find(x=>x.id===id);PJ=(i.pieces||[]).slice();modal('Modifier la réparation',fInc(i),(d,fd)=>incSave(i,d,fd));setTimeout(majIncTot,0);};

A.editAgence=()=>{

    num('Commission de gestion (% des loyers encaissés)','commission',a.commission||0,false)+

function setLogo(f){
  if(!/^image\//.test(f.type))return toast('Choisissez une image');
  const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,256/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.settings.agence={...AG(),logo:c.toDataURL('image/png')};loadLogo();save();render();toast('Logo enregistré ✅');};i.onerror=()=>toast('Image illisible');i.src=r.result;};
  r.readAsDataURL(f);
}
A.delLogo=()=>{const a={...AG()};delete a.logo;db.settings.agence=a;loadLogo();save();render();};

<h2>Article 1 — Objet</h2><p>Le bailleur donne en location au locataire le logement <b>${esc(l?.nom||'')}</b> (${esc(l?.type||'')}, étage ${esc(l?.etage||'')}) situé dans l’immeuble <b>${esc(im.nom||'')}</b>, ${esc(im.adresse||'')}, à usage ${pro?'professionnel':'exclusif d’habitation'}.</p>
<h2>Article 2 — Durée</h2><p>Le bail est consenti pour une durée ${dur}. Il se renouvelle par tacite reconduction, sauf congé donné par l’une des parties avec un préavis d’au moins trois (3) mois.</p>
<h2>Article 3 — Loyer et charges</h2><p>Le loyer mensuel est fixé à <b>${fcfa(cl)}</b>${Number(cc)?` auquel s’ajoutent <b>${fcfa(cc)}</b> de charges, soit un total de <b>${fcfa(loyer)}</b>`:''} par mois, payable d’avance au plus tard le <b>${b.jour}</b> de chaque mois, en espèces, par Mobile Money ou par virement. Un reçu numéroté est remis pour chaque paiement.</p>
<h2>Article 4 — Dépôt de garantie (caution)</h2><p>Le locataire verse ce jour une caution de <b>${fcfa(b.caution)}</b>. Elle ne produit pas d’intérêts et sera restituée à la sortie, déduction faite des sommes restant dues et du coût des réparations locatives constatées par l’état des lieux de sortie.</p>
<h2>Article 5 — Obligations du locataire</h2><p>Le locataire s’engage à payer le loyer aux échéances convenues ; à user paisiblement des lieux ; à les entretenir et à effectuer les menues réparations ; à ne pas sous-louer ni céder le bail sans accord écrit du bailleur ; à ne pas transformer les lieux sans autorisation ; à payer ses consommations d’eau et d’électricité ; à laisser visiter les lieux pour les travaux nécessaires.</p>
<h2>Article 6 — Obligations du bailleur</h2><p>Le bailleur s’engage à délivrer un logement en bon état d’usage, à assurer au locataire une jouissance paisible et à effectuer les grosses réparations.</p>
<h2>Article 7 — Résiliation</h2><p>À défaut de paiement du loyer à son échéance et après une mise en demeure restée sans effet, le bail pourra être résilié dans les conditions prévues par la loi.</p>
<h2>Article 8 — État des lieux</h2><p>Un état des lieux est établi contradictoirement à l’entrée et à la sortie du locataire (voir annexe).</p>

/* ---------- Relances ---------- */
const TONS={courtois:'Courtois',ferme:'Ferme',dernier:'Dernier rappel'};
function aRelancer(){
  const out=[],cur=curMois();
  BAUX().forEach(b=>{
    const t=locataire(b.locataireId);
    const a=arrieres(b);
    if(a.tot>0){
      const d0=`${a.list[0].m}-${String(Math.min(28,b.jour)).padStart(2,'0')}`;
      const promesseKo=a.list.some(x=>accordDate(b,x.m)&&!accordActif(b,x.m));
      out.push({b,t,type:'retard',montant:a.tot,jours:-jours(d0),detail:`${a.n} mois : ${a.list.map(x=>moisLabel(x.m)).join(', ')}`,promesseKo});
    }
    accords([b]).filter(x=>x.ok&&jours(x.d)<=3).forEach(x=>out.push({b,t,type:'promesse',montant:x.r,jours:jours(x.d),detail:`Reste ${deM(x.m)} promis le ${fmtDate(x.d)}`,m:x.m,d:x.d}));
    if(!b.fin&&bailActif(b,cur)){
      const s=statutBail(b,cur),ech=`${cur}-${String(Math.min(28,b.jour)).padStart(2,'0')}`,j=jours(ech);
      if(s.statut==='attente'&&j>=0&&j<=5)out.push({b,t,type:'avant',montant:s.reste,jours:j,detail:`Échéance ${deM(cur)} le ${fmtDate(ech)}`});
    }
  });
  const ord={retard:0,promesse:1,avant:2};
  return out.sort((x,y)=>ord[x.type]-ord[y.type]||y.montant-x.montant);
}
function msgRelance(r){
  const n=r.t?.nom||'',lg=logNom(r.b.logementId),sig=AG().nom?`\n\n${AG().nom}${AG().tel?' — '+AG().tel:''}`:(imm(logement(r.b.logementId)?.immeubleId)?.proprietaire?`\n\n${imm(logement(r.b.logementId)?.immeubleId).proprietaire}`:'');
  if(r.type==='avant')return `Bonjour ${n}, petit rappel amical : le loyer ${deM(curMois())} pour le logement ${lg} (${fcfa(r.montant)}) arrive à échéance le ${fmtDate(`${curMois()}-${String(Math.min(28,r.b.jour)).padStart(2,'0')}`)}. Vous pouvez payer en espèces ou par Mobile Money. Merci et bonne journée.${sig}`;
  if(r.type==='promesse')return `Bonjour ${n}, comme convenu, le reste du loyer ${deM(r.m)} pour ${lg}, soit ${fcfa(r.montant)}, est attendu le ${fmtDate(r.d)}. Merci de votre ponctualité.${sig}`;
  const ton=state.ton||'courtois';
  if(ton==='courtois')return `Bonjour ${n}, sauf erreur de notre part, nous n’avons pas encore reçu le règlement de ${fcfa(r.montant)} pour le logement ${lg} (${r.detail}). Merci de bien vouloir régulariser dès que possible. Si vous avez déjà payé, merci de ne pas tenir compte de ce message.${sig}`;
  if(ton==='ferme')return `Bonjour ${n}, malgré nos précédents rappels, la somme de ${fcfa(r.montant)} reste impayée pour le logement ${lg} (${r.detail}). Nous vous demandons de régulariser votre situation sous 72 heures. Merci de nous contacter pour tout arrangement.${sig}`;
  return `Bonjour ${n}, DERNIER RAPPEL avant mise en demeure : vous restez devoir ${fcfa(r.montant)} au titre des loyers du logement ${lg} (${r.detail}). Sans règlement ou accord sous 7 jours, nous serons contraints d’engager la procédure prévue au contrat de bail.${sig}`;
}
const derniereRelance=b=>(b.relances||[]).slice(-1)[0];
function logRelance(bid,type){const b=db.baux.find(x=>x.id===bid);if(!b)return;b.relances=b.relances||[];b.relances.push({date:today(),type:type==='retard'?(state.ton||'courtois'):type});save();setTimeout(render,300);}
function pageRelances(){
  const L=aRelancer(),T={retard:'En retard',promesse:'Promesse à rappeler',avant:'Échéance proche'},C={retard:'neg',promesse:'warn',avant:''};
  const tot=sum(L.filter(r=>r.type==='retard'),r=>r.montant);
  return `<div class="row"><h2>Relances</h2><span class="muted">${L.length} relance(s) à faire${tot?` · <b class="neg">${fcfa(tot)}</b> en retard`:''}</span></div>
  <div class="row" style="justify-content:flex-start"><span class="muted">Ton des messages de retard :</span><div class="seg">${Object.entries(TONS).map(([k,v])=>`<button class="${(state.ton||'courtois')===k?'on':''}" data-a="ton" data-id="${k}">${v}</button>`).join('')}</div></div>
  ${L.length?L.map(r=>{
    const dr=derniereRelance(r.b),msg=msgRelance(r);
    return `<div class="card"><div class="row"><div><button class="linkbtn" data-a="fiche" data-id="${r.b.locataireId}">${esc(r.t?.nom)}</button> · ${esc(logNom(r.b.logementId))} <span class="badge ${C[r.type]}">${T[r.type]}${r.type==='retard'?` · ${r.jours} j`:r.type==='avant'?` · dans ${r.jours} j`:''}</span>${r.promesseKo?' <span class="badge neg">Promesse non tenue</span>':''}</div><b class="${r.type==='retard'?'neg':''}">${fcfa(r.montant)}</b></div>
    <p class="muted small">${esc(r.detail)}${dr?` · Dernière relance : ${fmtDate(dr.date)}${dr.type&&TONS[dr.type]?' ('+TONS[dr.type].toLowerCase()+')':''}`:' · Jamais relancé'}${(r.b.relances||[]).length>1?` · ${(r.b.relances||[]).length} relances au total`:''}</p>
    <details><summary class="muted small">Voir le message</summary><p class="msg">${esc(msg).replace(/\n/g,'<br>')}</p></details>
    <div class="btns">${r.t?.tel?`<a class="btn wa sm" href="${esc(waLink(r.t.tel,msg))}" target="_blank" rel="noopener" data-log="${r.b.id}|${r.type}">WhatsApp</a><a class="btn sm ghost" href="sms:${esc(r.t.tel)}?body=${encodeURIComponent(msg)}" data-log="${r.b.id}|${r.type}">SMS</a>`:'<span class="muted small">Pas de téléphone</span>'}
    <button class="sm ghost" data-a="copyMsg" data-id="${r.b.id}|${r.type}">📋 Copier</button>${r.type!=='avant'?`<button class="sm primary" data-a="encaisser" data-id="${r.b.id}">Encaisser</button>`:''}</div></div>`;
  }).join(''):'<div class="card"><p class="ok-msg">✅ Aucune relance à faire. Tous les locataires sont à jour.</p></div>'}`;
}
A.ton=v=>{state.ton=v;render();};
A.copyMsg=async k=>{const [bid,type]=k.split('|');const r=aRelancer().find(x=>x.b.id===bid&&x.type===type);if(!r)return;try{await navigator.clipboard.writeText(msgRelance(r));logRelance(bid,type);toast('Message copié ✅');}catch(e){toast('Copie impossible ici');}};

/* ---------- Relevé mensuel propriétaire ---------- */
function releve(imId,ym){
  const im=imm(imId),lids=new Set(db.logements.filter(l=>l.immeubleId===imId).map(l=>l.id)),bids=new Set(db.baux.filter(b=>lids.has(b.logementId)).map(b=>b.id));
  const rc=recus(db.paiements.filter(p=>bids.has(p.bailId)&&p.date.slice(0,7)===ym));
  const deps=db.depenses.filter(d=>d.immeubleId===imId&&d.date.slice(0,7)===ym);
  const enc=sum(rc,r=>r.tot),dep=sum(deps,d=>d.montant),pct=Number(AG().commission)||0,com=Math.round(enc*pct/100);
  const imp=sum(db.baux.filter(b=>bids.has(b.id)),b=>arrieres(b).tot);
  return {im,rc,deps,enc,dep,pct,com,net:enc-dep-com,imp};
}
function releveTexte(R,ym){
  return `*RELEVÉ DE GESTION — ${moisLabel(ym).toUpperCase()}*\n${R.im.nom}\n\nLoyers encaissés : ${fcfa(R.enc)} (${R.rc.length} reçu(s))\nDépenses : − ${fcfa(R.dep)}${R.pct?`\nCommission de gestion (${R.pct} %) : − ${fcfa(R.com)}`:''}\n*Net à reverser : ${fcfa(R.net)}*${R.imp?`\n\nImpayés en cours : ${fcfa(R.imp)}`:''}${AG().nom?`\n\n${AG().nom}`:''}`;
}
function releveSection(){
  const ym=state.mois,list=(state.imm==='all'?db.immeubles:db.immeubles.filter(i=>i.id===state.imm));
  return `<div class="row"><h3>Relevé mensuel du propriétaire</h3>${monthNav()}</div>
  ${tbl([['Immeuble'],['Encaissé','n'],['Dépenses','n'],[`Commission${AG().commission?` (${AG().commission} %)`:''}`,'n'],['Net à reverser','n'],['','act']],list.map(im=>{const R=releve(im.id,ym);return [`<b>${esc(im.nom)}</b><div class="muted small">${esc(im.proprietaire||'')}</div>`,fcfa(R.enc),fcfa(R.dep),fcfa(R.com),`<b class="${R.net>=0?'ok':'neg'}">${fcfa(R.net)}</b>`,
    `${im.contact?`<a class="btn wa sm" href="${esc(waLink(im.contact,releveTexte(R,ym)))}" target="_blank" rel="noopener">WhatsApp</a>`:''}<button class="sm ghost" data-a="dlReleve" data-id="${im.id}">⬇ Relevé</button>`];}),'Aucun immeuble.')}
  ${AG().commission?'':'<p class="muted small">Astuce : indiquez votre commission de gestion dans Paramètres → Votre agence pour la déduire automatiquement.</p>'}`;
}

<p><b>${esc(R.im.nom)}</b> — ${esc(R.im.adresse||'')}<br>Propriétaire : ${esc(R.im.proprietaire||'—')} · Édité le ${fmtDate(today())}</p>
<table><tr><td>Loyers encaissés</td><td class="n">${fcfa(R.enc)}</td></tr><tr><td>Dépenses</td><td class="n">− ${fcfa(R.dep)}</td></tr>${R.pct?`<tr><td>Commission de gestion (${R.pct} %)</td><td class="n">− ${fcfa(R.com)}</td></tr>`:''}<tr class="tot"><td>Net à reverser au propriétaire</td><td class="n">${fcfa(R.net)}</td></tr></table>

${R.imp?`<p>Impayés en cours sur l’immeuble : <b>${fcfa(R.imp)}</b></p>`:''}
<table class="sig"><tr><td>Le gestionnaire</td><td>Le propriétaire</td></tr><tr><td style="height:70px"></td><td></td></tr></table>`);
  saveFile(`releve-${R.im.nom.replace(/\s+/g,'-')}-${ym}.html`,html,'text/html');
};
A.csvLocataires=()=>{
  const rows=[['Nom','Téléphone','Email','Profession','Pièce d’identité','Logement','Immeuble','Entrée','Loyer','Payé jusqu’à','Arriérés']];
  locVisibles().forEach(t=>{const b=db.baux.find(x=>x.locataireId===t.id&&!x.fin)||db.baux.filter(x=>x.locataireId===t.id).slice(-1)[0];const l=b?logement(b.logementId):null;
    rows.push([t.nom,t.tel||'',t.email||'',t.profession||'',t.piece||'',l?.nom||'',imm(l?.immeubleId)?.nom||'',b?fmtDate(b.debut):'',b?montantDu(b,curMois()):'',b&&payeJusqua(b)?moisLabel(payeJusqua(b)):'',b?sum(db.baux.filter(x=>x.locataireId===t.id),x=>arrieres(x).tot):0]);});
  saveFile(`locataires-${today()}.csv`,toCsv(rows),'text/csv');
};

document.addEventListener('input',e=>{

  if(e.target.id==='immSel'){state.imm=e.target.value;render();}
  if(e.target.id==='autoRecu'){db.settings.autoRecu=e.target.checked;save();toast(e.target.checked?'Reçu automatique activé':'Reçu automatique désactivé');}
  if(e.target.id==='importFile'&&e.target.files[0])importFile(e.target.files[0]);

});
document.addEventListener('submit',e=>{
  if(e.target.id!=='lockForm')return;

  if(hashPin(i.value)===db.settings.pin){state.unlocked=true;i.value='';saveUi();checkLock();}

});
